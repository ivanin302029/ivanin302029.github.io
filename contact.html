<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1120">
<title>Assistance — Mon Bot PC</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #0B1120;
    color: #F8FAFC;
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 30px 15px;
}

.container { max-width: 900px; margin: auto; }

a { color: #60A5FA; text-decoration: none; }

h1, h2, .ticket h3 { color: #60A5FA; }

.card {
    background: #172033;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #334155;
    margin-top: 20px;
}

input, textarea, select {
    width: 100%;
    background: #0B1120;
    color: white;
    border: 1px solid #334155;
    border-radius: 9px;
    padding: 12px;
    margin: 8px 0 15px;
    font-family: inherit;
}

textarea { min-height: 110px; resize: vertical; }

button, .button {
    display: inline-block;
    background: #3B82F6;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
}

button:disabled { opacity: .5; cursor: wait; }

.hidden { display: none !important; }

.ticket {
    background: #0B1120;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
    margin-top: 18px;
}

.small { color: #94A3B8; font-size: 13px; }

.status { color: #22C55E; font-weight: bold; }

.conversation {
    background: #111827;
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
    max-height: 450px;
    overflow-y: auto;
}

.bubble {
    padding: 13px;
    margin: 12px 0;
    border-radius: 12px;
    max-width: 90%;
    overflow-wrap: anywhere;
}

.bubble p { white-space: pre-wrap; line-height: 1.6; }

.user-message { background: #1D4ED8; margin-left: auto; }
.admin-message { background: #334155; margin-right: auto; }
.old-message { background: #263445; }

.file-link { display: block; margin-top: 10px; color: #93C5FD; }

.notice { color: #22C55E; margin: 15px 0; overflow-wrap: anywhere; }

.message-author {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 8px;
    min-height: 32px;
}

.message-avatar, .message-avatar-placeholder {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    flex: 0 0 30px;
}

.message-avatar-placeholder {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #1D4ED8;
}
</style>
</head>

<body>
<div class="container">

<a href="index.html">← Retour à l'accueil</a>

<h1>📩 Assistance Mon Bot PC</h1>

<p>Contactez notre assistance et retrouvez toutes vos conversations.</p>

<div id="loading" class="card">
    Vérification de votre connexion...
</div>

<div id="notConnected" class="card hidden">
    <h2>Connexion nécessaire</h2>
    <p>Connectez-vous pour contacter l'assistance.</p>
    <a class="button" href="connexion.html">Se connecter</a>
</div>

<div id="support" class="hidden">

    <section class="card">
        <h2>➕ Nouveau ticket</h2>

        <p class="small">
            Connecté : <span id="userEmail"></span>
        </p>

        <form id="contactForm">
            <label for="subject">Sujet</label>
            <select id="subject" required>
                <option value="">Choisir un sujet</option>
                <option>Problème technique</option>
                <option>Problème de connexion</option>
                <option>Problème d'analyse</option>
                <option>Suggestion</option>
                <option>Autre</option>
            </select>

            <label for="title">Titre</label>
            <input id="title" maxlength="120" required
                   placeholder="Titre du problème">

            <label for="content">Message</label>
            <textarea id="content" minlength="10" maxlength="3000"
                      required
                      placeholder="Expliquez votre problème..."></textarea>

            <button id="sendButton" type="submit">
                Envoyer le ticket
            </button>
        </form>

        <p id="notice" class="notice" role="status"></p>
    </section>

    <section class="card">
        <h2>💬 Mes conversations</h2>

        <button id="refresh" type="button">↻ Actualiser</button>

        <div id="tickets"></div>
    </section>

</div>
</div>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    addDoc,
    setDoc,
    query,
    where,
    serverTimestamp,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";


const firebaseConfig = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGF2FYnntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    messagingSenderId: "691729637594",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const ADMIN_UIDS = [
    "rWEk3vGHK1W2EDvemVfw6xNtKxU2",
    "8lq3zxa8nkdZ6hXpa8FeZTpI55Q2"
];

const allowedTypes = [
    "image/png",
    "image/jpeg",
    "image/webp",
    "application/pdf",
    "text/plain"
];

let currentUser = null;
let unsubscribeTickets = null;
let unsubscribeProfiles = [];
const unsubscribeMessages = new Map();
const ticketUIs = new Map();
const adminProfiles = new Map();

const ticketsContainer = document.getElementById("tickets");
const notice = document.getElementById("notice");
const loading = document.getElementById("loading");
const notConnected = document.getElementById("notConnected");
const support = document.getElementById("support");


function showNotice(text, error = false) {
    notice.textContent = text;
    notice.style.color = error ? "#EF4444" : "#22C55E";
}

function make(tag, text = "", className = "") {
    const element = document.createElement(tag);
    element.textContent = text;

    if (className) {
        element.className = className;
    }

    return element;
}

function formatDate(timestamp) {
    if (!timestamp?.toDate) {
        return "Envoi en cours…";
    }

    return timestamp.toDate().toLocaleString("fr-CA");
}

function validateFile(file) {
    if (!file) return;

    if (!allowedTypes.includes(file.type)) {
        throw new Error(
            "Type de fichier non autorisé. Formats acceptés : PNG, JPG, WEBP, PDF ou TXT."
        );
    }

    if (file.size > 5 * 1024 * 1024) {
        throw new Error(
            "Fichier trop volumineux : maximum 5 Mo."
        );
    }
}

async function uploadAttachment(ticketId, messageId, file) {
    validateFile(file);

    const extensions = {
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/webp": "webp",
        "application/pdf": "pdf",
        "text/plain": "txt"
    };

    const extension = extensions[file.type];

    if (!extension) {
        throw new Error("Format de pièce jointe non accepté.");
    }

    const path =
        `tickets/${ticketId}/${messageId}/piece-jointe.${extension}`;

    await uploadBytes(ref(storage, path), file, {
        contentType: file.type
    });

    return {
        path,
        name: file.name
    };
}

function addFileLink(container, data) {
    if (!data.attachmentPath) return;

    const link = make(
        "a",
        "📎 " + (data.attachmentName || "Pièce jointe"),
        "file-link"
    );

    link.href = "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.addEventListener("click", async event => {
        event.preventDefault();

        try {
            const url = await getDownloadURL(
                ref(storage, data.attachmentPath)
            );

            window.open(url, "_blank", "noopener,noreferrer");
        } catch (error) {
            console.error("Erreur ouverture pièce jointe :", error);

            alert(
                "Impossible d'ouvrir la pièce jointe. Vérifiez les règles Firebase Storage."
            );
        }
    });

    container.append(link);
}

function profileFor(uid) {
    return adminProfiles.get(uid) || {
        nickname: "Assistance",
        avatarUrl: ""
    };
}

function appendAuthor(container, profile, fallbackIcon) {
    const row = make("div", "", "message-author");

    if (profile.avatarUrl) {
        const avatar = document.createElement("img");

        avatar.className = "message-avatar";
        avatar.src = profile.avatarUrl;
        avatar.alt = "";
        avatar.referrerPolicy = "no-referrer";

        avatar.onerror = () => {
            avatar.remove();
        };

        row.append(avatar);
    } else {
        row.append(
            make(
                "span",
                fallbackIcon,
                "message-avatar-placeholder"
            )
        );
    }

    row.append(
        make("strong", profile.nickname || "Assistance")
    );

    container.append(row);
}

function renderMessages(ticket, ui, messages) {
    const container = ui.conversation;
    container.replaceChildren();

    // Message original du ticket.
    const original = make("div", "", "bubble old-message");

    original.append(
        make("strong", "👤 Message initial"),
        make("p", ticket.content || "")
    );

    container.append(original);

    // Compatibilité avec les anciens tickets utilisant ticket.reply.
    if (ticket.reply) {
        const oldReply = make(
            "div",
            "",
            "bubble admin-message"
        );

        appendAuthor(
            oldReply,
            { nickname: "Assistance", avatarUrl: "" },
            "🛠️"
        );

        oldReply.append(make("p", ticket.reply));
        container.append(oldReply);
    }

    const sortedMessages = [...messages].sort((a, b) => {
        return (a.createdAt?.seconds || 0) -
               (b.createdAt?.seconds || 0);
    });

    for (const message of sortedMessages) {
        const isAdmin = ADMIN_UIDS.includes(message.uid);

        const bubble = make(
            "div",
            "",
            "bubble " +
            (isAdmin ? "admin-message" : "user-message")
        );

        if (isAdmin) {
            appendAuthor(
                bubble,
                profileFor(message.uid),
                "🛠️"
            );
        } else {
            bubble.append(make("strong", "👤 Vous"));
        }

        bubble.append(
            make("p", message.text || ""),
            make("div", formatDate(message.createdAt), "small")
        );

        addFileLink(bubble, message);
        container.append(bubble);
    }

    container.scrollTop = container.scrollHeight;
}

function updateTicketUI(ticket, ui) {
    ui.ticket = ticket;

    ui.title.textContent = ticket.title || "Sans titre";

    ui.subject.textContent =
        "Sujet : " + (ticket.subject || "Non précisé");

    ui.status.textContent =
        "Statut : " + (ticket.status || "En attente");

    ui.status.style.color =
        ticket.status === "Fermé" ? "#F87171" : "#22C55E";

    const closed = ticket.status === "Fermé";

    ui.replyArea.classList.toggle("hidden", closed);
    ui.closedNotice.classList.toggle("hidden", !closed);
}

function createTicketUI(ticket) {
    const card = make("article", "", "ticket");

    const title = make("h3", ticket.title || "Sans titre");

    const subject = make(
        "p",
        "Sujet : " + (ticket.subject || "Non précisé"),
        "small"
    );

    const status = make(
        "p",
        "Statut : " + (ticket.status || "En attente"),
        "status"
    );

    const conversation = make(
        "div",
        "Chargement de la conversation…",
        "conversation"
    );

    const replyArea = make("div");

    const textarea = document.createElement("textarea");
    textarea.placeholder = "Répondez à l'assistance…";
    textarea.maxLength = 3000;
    textarea.setAttribute("aria-label", "Votre réponse");

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".png,.jpg,.jpeg,.webp,.pdf,.txt";
    fileInput.setAttribute(
        "aria-label",
        "Ajouter une pièce jointe (facultatif)"
    );

    const button = make("button", "📨 Envoyer le message");
    button.type = "button";

    const replyNotice = make("p", "", "notice");

    const closedNotice = make(
        "p",
        "🔒 Ce ticket est fermé.",
        "small hidden"
    );

    const ui = {
        card,
        title,
        subject,
        status,
        conversation,
        replyArea,
        closedNotice,
        textarea,
        fileInput,
        button,
        replyNotice,
        ticket,
        messages: []
    };

    button.addEventListener("click", async () => {
        await sendReply(
            ui.ticket,
            textarea,
            fileInput,
            button,
            replyNotice
        );
    });

    replyArea.append(
        textarea,
        fileInput,
        button,
        replyNotice
    );

    card.append(
        title,
        subject,
        status,
        conversation,
        replyArea,
        closedNotice
    );

    updateTicketUI(ticket, ui);

    return ui;
}

async function sendReply(
    ticket,
    textarea,
    fileInput,
    button,
    replyNotice
) {
    if (!currentUser) {
        alert("Connectez-vous pour répondre.");
        return;
    }

    if (ticket.status === "Fermé") {
        alert("Ce ticket est fermé.");
        return;
    }

    const text = textarea.value.trim();
    const file = fileInput.files?.[0] || null;

    if (!text && !file) {
        alert("Écrivez un message ou ajoutez un fichier.");
        return;
    }

    try {
        validateFile(file);
    } catch (error) {
        alert(error.message);
        return;
    }

    button.disabled = true;
    replyNotice.textContent = "";
    replyNotice.style.color = "#22C55E";

    try {
        // Le fichier et le message utilisent le même identifiant.
        const messageRef = doc(
            collection(
                db,
                "support_messages",
                ticket.id,
                "messages"
            )
        );

        let attachment = null;

        if (file) {
            attachment = await uploadAttachment(
                ticket.id,
                messageRef.id,
                file
            );
        }

        const data = {
            uid: currentUser.uid,
            text,
            createdAt: serverTimestamp()
        };

        if (attachment) {
            data.attachmentPath = attachment.path;
            data.attachmentName = attachment.name;
        }

        await setDoc(messageRef, data);

        textarea.value = "";
        fileInput.value = "";

        replyNotice.textContent = "Message envoyé.";
    } catch (error) {
        console.error("Erreur envoi réponse :", error);

        replyNotice.textContent =
            "Erreur d'envoi : " +
            (error.message || "Veuillez réessayer.");

        replyNotice.style.color = "#EF4444";
    } finally {
        button.disabled = false;
    }
}

function subscribeToTicketMessages(ticketId, ui) {
    if (unsubscribeMessages.has(ticketId)) return;

    const unsubscribe = onSnapshot(
        collection(
            db,
            "support_messages",
            ticketId,
            "messages"
        ),
        snapshot => {
            ui.messages = snapshot.docs.map(item => ({
                id: item.id,
                ...item.data()
            }));

            renderMessages(ui.ticket, ui, ui.messages);
        },
        error => {
            console.error("Erreur écoute messages :", error);

            ui.conversation.textContent =
                "Impossible de charger les messages. Vérifiez les règles Firestore.";
        }
    );

    unsubscribeMessages.set(ticketId, unsubscribe);
}

function subscribeToTickets() {
    if (!currentUser) return;

    if (unsubscribeTickets) {
        unsubscribeTickets();
        unsubscribeTickets = null;
    }

    unsubscribeTickets = onSnapshot(
        query(
            collection(db, "support_messages"),
            where("uid", "==", currentUser.uid)
        ),
        snapshot => {
            const tickets = snapshot.docs.map(item => ({
                id: item.id,
                ...item.data()
            }));

            tickets.sort((a, b) => {
                return (b.createdAt?.seconds || 0) -
                       (a.createdAt?.seconds || 0);
            });

            const liveIds = new Set(
                tickets.map(ticket => ticket.id)
            );

            // Nettoyer les tickets supprimés.
            for (const [ticketId, ui] of ticketUIs.entries()) {
                if (!liveIds.has(ticketId)) {
                    unsubscribeMessages.get(ticketId)?.();
                    unsubscribeMessages.delete(ticketId);

                    ui.card.remove();
                    ticketUIs.delete(ticketId);
                }
            }

            if (tickets.length === 0) {
                ticketsContainer.textContent =
                    "Aucun ticket pour le moment.";
                return;
            }

            ticketsContainer.replaceChildren();

            for (const ticket of tickets) {
                let ui = ticketUIs.get(ticket.id);

                if (!ui) {
                    ui = createTicketUI(ticket);
                    ticketUIs.set(ticket.id, ui);

                    subscribeToTicketMessages(ticket.id, ui);
                } else {
                    updateTicketUI(ticket, ui);
                    renderMessages(ticket, ui, ui.messages);
                }

                ticketsContainer.append(ui.card);
            }
        },
        error => {
            console.error("Erreur écoute tickets :", error);

            ticketsContainer.textContent =
                "Impossible de charger les tickets. Vérifiez les règles Firestore.";
        }
    );
}

function subscribeToAdminProfiles() {
    // Éviter de créer plusieurs écouteurs sur les profils.
    for (const unsubscribe of unsubscribeProfiles) {
        unsubscribe();
    }

    unsubscribeProfiles = [];

    for (const uid of ADMIN_UIDS) {
        const unsubscribe = onSnapshot(
            doc(db, "admin_profiles", uid),
            snapshot => {
                const data = snapshot.exists()
                    ? snapshot.data()
                    : {};

                adminProfiles.set(uid, {
                    nickname:
                        typeof data.nickname === "string" &&
                        data.nickname.trim()
                            ? data.nickname.trim()
                            : "Assistance",

                    avatarUrl:
                        typeof data.avatarUrl === "string"
                            ? data.avatarUrl
                            : ""
                });

                for (const ui of ticketUIs.values()) {
                    renderMessages(ui.ticket, ui, ui.messages);
                }
            },
            error => {
                console.warn(
                    "Profil administrateur indisponible :",
                    error
                );

                adminProfiles.set(uid, {
                    nickname: "Assistance",
                    avatarUrl: ""
                });
            }
        );

        unsubscribeProfiles.push(unsubscribe);
    }
}

onAuthStateChanged(auth, user => {
    currentUser = user;

    loading.classList.add("hidden");

    if (!user) {
        if (unsubscribeTickets) {
            unsubscribeTickets();
            unsubscribeTickets = null;
        }

        for (const unsubscribe of unsubscribeMessages.values()) {
            unsubscribe();
        }

        unsubscribeMessages.clear();

        for (const unsubscribe of unsubscribeProfiles) {
            unsubscribe();
        }

        unsubscribeProfiles = [];
        ticketUIs.clear();
        adminProfiles.clear();
        ticketsContainer.replaceChildren();

        notConnected.classList.remove("hidden");
        support.classList.add("hidden");

        return;
    }

    notConnected.classList.add("hidden");
    support.classList.remove("hidden");

    document.getElementById("userEmail").textContent =
        user.email || "Compte connecté";

    subscribeToAdminProfiles();
    subscribeToTickets();
});

document.getElementById("contactForm").addEventListener(
    "submit",
    async event => {
        event.preventDefault();

        if (!currentUser) {
            showNotice(
                "Connectez-vous avant de créer un ticket.",
                true
            );
            return;
        }

        const subject =
            document.getElementById("subject").value;

        const title =
            document.getElementById("title").value.trim();

        const content =
            document.getElementById("content").value.trim();

        if (!subject || !title || content.length < 10) {
            showNotice(
                "Complétez correctement le formulaire. Le message doit contenir au moins 10 caractères.",
                true
            );
            return;
        }

        const button = document.getElementById("sendButton");
        button.disabled = true;

        try {
            await addDoc(
                collection(db, "support_messages"),
                {
                    uid: currentUser.uid,
                    email: currentUser.email || "",
                    subject,
                    title,
                    content,
                    status: "En attente",
                    createdAt: serverTimestamp()
                }
            );

            document.getElementById("contactForm").reset();

            showNotice(
                "Ticket créé avec succès ! Il apparaîtra automatiquement dans vos conversations."
            );
        } catch (error) {
            console.error("Erreur création ticket :", error);

            showNotice(
                "Erreur : " +
                (error.message || "Impossible de créer le ticket."),
                true
            );
        } finally {
            button.disabled = false;
        }
    }
);

document.getElementById("refresh").addEventListener(
    "click",
    () => {
        // Les écouteurs se mettent déjà à jour automatiquement.
        subscribeToTickets();
    }
);
</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
