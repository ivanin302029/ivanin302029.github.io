<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Assistance — Mon Bot PC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0B1120;
    color: #F8FAFC;
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 30px 15px;
}

.container {
    max-width: 900px;
    margin: auto;
}

a {
    color: #60A5FA;
    text-decoration: none;
}

h1, h2 {
    color: #60A5FA;
}

.card {
    background: #172033;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #334155;
    margin-top: 20px;
}

input, textarea, select {
    width: 100%;
    background: #0B1120;
    color: white;
    border: 1px solid #334155;
    border-radius: 9px;
    padding: 12px;
    margin: 8px 0 15px;
    font-family: inherit;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

button, .button {
    display: inline-block;
    background: #3B82F6;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.hidden {
    display: none !important;
}

.ticket {
    background: #0B1120;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
    margin-top: 18px;
}

.ticket h3 {
    color: #60A5FA;
}

.small {
    color: #94A3B8;
    font-size: 13px;
}

.status {
    color: #22C55E;
    font-weight: bold;
}

.conversation {
    background: #111827;
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
    max-height: 450px;
    overflow-y: auto;
}

.bubble {
    padding: 13px;
    margin: 12px 0;
    border-radius: 12px;
    max-width: 90%;
    overflow-wrap: anywhere;
}

.bubble p {
    white-space: pre-wrap;
    line-height: 1.6;
}

.user-message {
    background: #1D4ED8;
    margin-left: auto;
}

.admin-message {
    background: #334155;
    margin-right: auto;
}

.old-message {
    background: #263445;
}

.file-link {
    display: block;
    margin-top: 10px;
    color: #93C5FD;
}

.notice {
    color: #22C55E;
    margin: 15px 0;
    overflow-wrap: anywhere;
}
</style>

</head>

<body>

<div class="container">

<a href="index.html">← Retour à l'accueil</a>

<h1>📩 Assistance Mon Bot PC</h1>

<p>
    Contactez notre assistance et retrouvez
    toutes vos conversations.
</p>

<div id="loading" class="card">
    Vérification de votre connexion...
</div>

<div id="notConnected" class="card hidden">

    <h2>Connexion nécessaire</h2>

    <p>Connectez-vous pour contacter l'assistance.</p>

    <a class="button" href="connexion.html">
        Se connecter
    </a>

</div>

<div id="support" class="hidden">

    <section class="card">

        <h2>➕ Nouveau ticket</h2>

        <p class="small">
            Connecté : <span id="userEmail"></span>
        </p>

        <form id="contactForm">

            <label>Sujet</label>

            <select id="subject" required>
                <option value="">Choisir un sujet</option>
                <option>Problème technique</option>
                <option>Problème de connexion</option>
                <option>Problème d'analyse</option>
                <option>Suggestion</option>
                <option>Autre</option>
            </select>

            <label>Titre</label>

            <input
                id="title"
                maxlength="120"
                required
                placeholder="Titre du problème"
            >

            <label>Message</label>

            <textarea
                id="content"
                minlength="10"
                maxlength="3000"
                required
                placeholder="Expliquez votre problème..."
            ></textarea>

            <button id="sendButton" type="submit">
                Envoyer le ticket
            </button>

        </form>

        <p id="notice" class="notice"></p>

    </section>

    <section class="card">

        <h2>💬 Mes conversations</h2>

        <button id="refresh">
            ↻ Actualiser
        </button>

        <div id="tickets"></div>

    </section>

</div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGF2FYnntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    messagingSenderId: "691729637594",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;

const ticketsContainer = document.getElementById("tickets");
const notice = document.getElementById("notice");

const allowedTypes = [
    "image/png",
    "image/jpeg",
    "image/webp",
    "application/pdf",
    "text/plain"
];

function showNotice(text, error = false) {
    notice.textContent = text;
    notice.style.color = error ? "#EF4444" : "#22C55E";
}

function make(tag, text = "", className = "") {
    const element = document.createElement(tag);
    element.textContent = text;
    element.className = className;
    return element;
}

function formatDate(timestamp) {
    return timestamp?.toDate
        ? timestamp.toDate().toLocaleString("fr-CA")
        : "";
}

function validateFile(file) {

    if (!file) return true;

    if (!allowedTypes.includes(file.type)) {
        throw new Error("Type de fichier non autorisé.");
    }

    if (file.size > 5 * 1024 * 1024) {
        throw new Error("Fichier trop volumineux : maximum 5 Mo.");
    }

    return true;
}

async function uploadAttachment(ticketId, messageId, file) {

    validateFile(file);

    const extension = {
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/webp": "webp",
        "application/pdf": "pdf",
        "text/plain": "txt"
    }[file.type];

    const path =
        `tickets/${ticketId}/${messageId}/piece-jointe.${extension}`;

    const fileRef = ref(storage, path);

    await uploadBytes(fileRef, file, {
        contentType: file.type
    });

    return {
        path,
        name: file.name
    };
}

function addFileLink(container, ticketId, messageId, data) {

    if (!data.attachmentPath) return;

    const link = make(
        "a",
        "📎 " + (data.attachmentName || "Pièce jointe"),
        "file-link"
    );

    link.href = "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.addEventListener("click", async event => {

        event.preventDefault();

        try {
            const fileRef = ref(storage, data.attachmentPath);
            const url = await getDownloadURL(fileRef);

            window.open(url, "_blank", "noopener,noreferrer");

        } catch (error) {
            console.error(error);
            alert("Impossible d'ouvrir la pièce jointe.");
        }
    });

    container.append(link);
}

async function loadConversation(ticket, container) {

    container.textContent = "Chargement de la conversation...";

    try {

        const snapshot = await getDocs(
            collection(
                db,
                "support_messages",
                ticket.id,
                "messages"
            )
        );

        const messages = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
        }));

        messages.sort((a, b) =>
            (a.createdAt?.seconds || 0) -
            (b.createdAt?.seconds || 0)
        );

        container.replaceChildren();

        // Conservation du premier message des anciens tickets
        const original = make(
            "div",
            "",
            "bubble old-message"
        );

        original.append(
            make("strong", "👤 Message initial"),
            make("p", ticket.content || "")
        );

        container.append(original);

        // Conservation des anciennes réponses administrateur
        if (ticket.reply) {

            const oldReply = make(
                "div",
                "",
                "bubble admin-message"
            );

            oldReply.append(
                make("strong", "🛠️ Ancienne réponse de l'assistance"),
                make("p", ticket.reply)
            );

            container.append(oldReply);
        }

        messages.forEach(message => {

            const isAdminMessage =
                message.uid !== ticket.uid;

            const bubble = make(
                "div",
                "",
                "bubble " + (
                    isAdminMessage
                        ? "admin-message"
                        : "user-message"
                )
            );

            bubble.append(
                make(
                    "strong",
                    isAdminMessage
                        ? "🛠️ Assistance Mon Bot PC"
                        : "👤 Vous"
                ),
                make("p", message.text || ""),
                make(
                    "div",
                    formatDate(message.createdAt),
                    "small"
                )
            );

            addFileLink(
                bubble,
                ticket.id,
                message.id,
                message
            );

            container.append(bubble);

        });

        container.scrollTop = container.scrollHeight;

    } catch (error) {

        console.error(error);

        container.textContent =
            "Impossible de charger la conversation.";
    }
}

async function sendReply(ticket, textarea, fileInput, button, conversation) {

    const text = textarea.value.trim();
    const file = fileInput.files[0];

    if (!text && !file) {
        alert("Écrivez un message ou ajoutez un fichier.");
        return;
    }

    if (ticket.status === "Fermé") {
        alert("Ce ticket est fermé.");
        return;
    }

    try {
        validateFile(file);
    } catch (error) {
        alert(error.message);
        return;
    }

    button.disabled = true;

    try {

        const messageRef = doc(
            collection(
                db,
                "support_messages",
                ticket.id,
                "messages"
            )
        );

        let attachment = null;

        if (file) {
            attachment = await uploadAttachment(
                ticket.id,
                messageRef.id,
                file
            );
        }

        const data = {
            uid: currentUser.uid,
            text,
            createdAt: serverTimestamp()
        };

        if (attachment) {
            data.attachmentPath = attachment.path;
            data.attachmentName = attachment.name;
        }

        await addDoc(
            collection(
                db,
                "support_messages",
                ticket.id,
                "messages"
            ),
            data
        );

        textarea.value = "";
        fileInput.value = "";

        await loadConversation(ticket, conversation);

    } catch (error) {

        console.error(error);

        alert("Erreur d'envoi : " + error.message);

    } finally {
        button.disabled = false;
    }
}

async function loadTickets() {

    if (!currentUser) return;

    ticketsContainer.textContent = "Chargement...";

    try {

        const snapshot = await getDocs(
            query(
                collection(db, "support_messages"),
                where("uid", "==", currentUser.uid)
            )
        );

        const tickets = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
        }));

        tickets.sort((a, b) =>
            (b.createdAt?.seconds || 0) -
            (a.createdAt?.seconds || 0)
        );

        ticketsContainer.replaceChildren();

        if (!tickets.length) {
            ticketsContainer.textContent = "Aucun ticket.";
            return;
        }

        tickets.forEach(ticket => {

            const card = make("article", "", "ticket");

            card.append(
                make("h3", ticket.title || "Sans titre"),
                make("p", "Sujet : " + ticket.subject, "small"),
                make("p", "Statut : " + ticket.status, "status")
            );

            const conversation = make(
                "div",
                "",
                "conversation"
            );

            card.append(conversation);

            loadConversation(ticket, conversation);

            if (ticket.status !== "Fermé") {

                const textarea = document.createElement("textarea");

                textarea.placeholder =
                    "Répondez à l'assistance...";

                textarea.maxLength = 3000;

                const fileInput = document.createElement("input");

                fileInput.type = "file";

                fileInput.accept =
                    ".png,.jpg,.jpeg,.webp,.pdf,.txt";

                const button = make(
                    "button",
                    "📨 Envoyer le message"
                );

                button.addEventListener("click", () => {

                    sendReply(
                        ticket,
                        textarea,
                        fileInput,
                        button,
                        conversation
                    );
                });

                card.append(
                    textarea,
                    fileInput,
                    button
                );

            } else {

                card.append(
                    make(
                        "p",
                        "🔒 Ce ticket est fermé.",
                        "small"
                    )
                );
            }

            ticketsContainer.append(card);
        });

    } catch (error) {

        console.error(error);

        ticketsContainer.textContent =
            "Impossible de charger les tickets.";
    }
}

onAuthStateChanged(auth, async user => {

    currentUser = user;

    document.getElementById("loading")
        .classList.add("hidden");

    if (!user) {

        document.getElementById("notConnected")
            .classList.remove("hidden");

        document.getElementById("support")
            .classList.add("hidden");

        return;
    }

    document.getElementById("notConnected")
        .classList.add("hidden");

    document.getElementById("support")
        .classList.remove("hidden");

    document.getElementById("userEmail").textContent =
        user.email || "Compte connecté";

    await loadTickets();
});

document.getElementById("contactForm")
.addEventListener("submit", async event => {

    event.preventDefault();

    if (!currentUser) return;

    const subject = document.getElementById("subject").value;
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!subject || !title || content.length < 10) {
        showNotice("Complétez correctement le formulaire.", true);
        return;
    }

    const button = document.getElementById("sendButton");

    button.disabled = true;

    try {

        await addDoc(
            collection(db, "support_messages"),
            {
                uid: currentUser.uid,
                email: currentUser.email || "",
                subject,
                title,
                content,
                status: "En attente",
                createdAt: serverTimestamp()
            }
        );

        document.getElementById("contactForm").reset();

        showNotice("Ticket créé avec succès !");

        await loadTickets();

    } catch (error) {

        console.error(error);

        showNotice("Erreur : " + error.message, true);

    } finally {

        button.disabled = false;
    }
});

document.getElementById("refresh")
.addEventListener("click", loadTickets);

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
