<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administration — Mon Bot PC</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0B1120;
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

a { color: #60A5FA; }

h1, h2 { color: #60A5FA; }

.card {
    background: #172033;
    padding: 25px;
    border: 1px solid #334155;
    border-radius: 15px;
    margin: 20px 0;
}

.item {
    background: #0B1120;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 18px;
    margin: 12px 0;
    overflow-wrap: anywhere;
}

input, textarea, select {
    display: block;
    width: 100%;
    background: #0B1120;
    color: white;
    border: 1px solid #475569;
    border-radius: 9px;
    padding: 12px;
    margin: 10px 0;
    font-family: inherit;
}

textarea {
    min-height: 110px;
}

button {
    background: #3B82F6;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
    margin: 5px;
}

button:disabled { opacity: .5; }

.danger { background: #DC2626; }

.hidden { display: none !important; }

.small {
    color: #94A3B8;
    font-size: 13px;
}

.text {
    white-space: pre-wrap;
    line-height: 1.6;
}

.option-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

.option-row input {
    flex: 1;
}

#countdown {
    color: #22C55E;
    font-size: 38px;
}
</style>

</head>

<body>

<main>

<a href="index.html">← Retour au site</a>

<h1>⚙️ Administration Mon Bot PC</h1>

<div id="access" class="card">
    Vérification des droits...
</div>

<div id="dashboard" class="hidden">

<section class="card">

    <h2>👤 Mon profil administrateur</h2>

    <form id="profileForm">

        <label>Pseudo public</label>

        <input
            id="nickname"
            maxlength="40"
            placeholder="Votre pseudo"
            required
        >

        <label>URL HTTPS de votre photo</label>

        <input
            id="avatarUrl"
            placeholder="https://..."
        >

        <button type="submit">
            Enregistrer mon profil
        </button>

    </form>

</section>

<section class="card">

    <h2>📩 Assistance</h2>

    <button id="refreshTickets">
        Actualiser les tickets
    </button>

    <div id="tickets"></div>

</section>

<section class="card">

    <h2>📰 Publier une actualité</h2>

    <form id="newsForm">

        <input
            id="newsTitle"
            maxlength="150"
            placeholder="Titre"
            required
        >

        <select id="newsCategory">
            <option>Mise à jour</option>
            <option>Annonce</option>
            <option>Maintenance</option>
            <option>Information</option>
        </select>

        <textarea
            id="newsContent"
            maxlength="10000"
            placeholder="Contenu"
            required
        ></textarea>

        <button type="submit">
            Publier l'actualité
        </button>

    </form>

    <h2>Actualités publiées</h2>

    <div id="newsList"></div>

</section>

<section class="card">

    <h2>📊 Créer un sondage</h2>

    <form id="pollForm">

        <label>Question</label>

        <input
            id="pollQuestion"
            maxlength="250"
            placeholder="Quelle fonctionnalité préférez-vous ?"
            required
        >

        <h3>Réponses possibles</h3>

        <div id="pollOptions"></div>

        <button id="addOption" type="button">
            ➕ Ajouter une réponse
        </button>

        <p class="small">
            Entre 2 et 10 réponses possibles.
        </p>

        <button id="savePoll" type="submit">
            Publier le sondage
        </button>

        <button id="cancelPoll" type="button" class="hidden">
            Annuler la modification
        </button>

    </form>

    <h2>Sondages publiés</h2>

    <div id="pollList"></div>

</section>

<section class="card">

    <h2>🔧 Maintenance</h2>

    <select id="duration">
        <option value="30">30 minutes</option>
        <option value="60">1 heure</option>
        <option value="120">2 heures</option>
        <option value="360">6 heures</option>
        <option value="720">12 heures</option>
        <option value="1440">24 heures</option>
    </select>

    <button id="startMaintenance" class="danger">
        Activer
    </button>

    <button id="stopMaintenance">
        Désactiver
    </button>

    <h3 id="maintenanceStatus"></h3>

    <div id="countdown"></div>

</section>

</div>

<p id="notice"></p>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    addDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    Timestamp,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const config = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGF2FYnntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const ADMINS = [
    "rWEk3vGHK1W2EDvemVfw6xNtKxU2",
    "8lq3zxa8nkdZ6hXpa8FeZTpI55Q2"
];

const app = initializeApp(config);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let editingPoll = null;
let maintenanceTimer = null;

const $ = id => document.getElementById(id);

function element(tag, text = "") {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
}

function notify(text) {
    $("notice").textContent = text;
}

function admin(user) {
    return user && ADMINS.includes(user.uid);
}

/* PROFIL */

async function chargerProfil() {
    const snapshot = await getDoc(
        doc(db, "admin_profiles", currentUser.uid)
    );

    if (snapshot.exists()) {
        $("nickname").value = snapshot.data().nickname || "";
        $("avatarUrl").value = snapshot.data().avatarUrl || "";
    }
}

$("profileForm").addEventListener("submit", async event => {
    event.preventDefault();

    const nickname = $("nickname").value.trim();
    const avatarUrl = $("avatarUrl").value.trim();

    if (!nickname) return;

    if (avatarUrl && !avatarUrl.startsWith("https://")) {
        alert("Utilisez une URL HTTPS.");
        return;
    }

    try {
        await setDoc(
            doc(db, "admin_profiles", currentUser.uid),
            { nickname, avatarUrl }
        );

        notify("Profil enregistré.");

    } catch (error) {
        alert(error.message);
    }
});

/* TICKETS */

async function chargerTickets() {
    const container = $("tickets");

    try {
        const snapshot = await getDocs(
            collection(db, "support_messages")
        );

        container.replaceChildren();

        for (const ticketDoc of snapshot.docs) {
            const ticket = ticketDoc.data();

            const carte = element("article");
            carte.className = "item";

            carte.append(
                element("h3", ticket.title || "Ticket"),
                element("p", ticket.email || ""),
                element("p", ticket.content || ""),
                element("p", "Statut : " + ticket.status)
            );

            if (ticket.reply) {
                carte.appendChild(
                    element("p", "Ancienne réponse : " + ticket.reply)
                );
            }

            const conversation = element("div");

            const messages = await getDocs(
                collection(
                    db,
                    "support_messages",
                    ticketDoc.id,
                    "messages"
                )
            );

            const liste = messages.docs.map(m => m.data());

            liste.sort((a, b) =>
                (a.createdAt?.seconds || 0) -
                (b.createdAt?.seconds || 0)
            );

            for (const message of liste) {
                conversation.appendChild(
                    element(
                        "p",
                        (ADMINS.includes(message.uid)
                            ? "🛠️ Assistance : "
                            : "👤 Utilisateur : ") +
                        message.text
                    )
                );
            }

            carte.appendChild(conversation);

            if (ticket.status !== "Fermé") {
                const textarea = element("textarea");

                textarea.placeholder = "Votre réponse...";

                const bouton = element("button", "Répondre");

                bouton.addEventListener("click", async () => {
                    const text = textarea.value.trim();

                    if (!text) return;

                    bouton.disabled = true;

                    try {
                        await addDoc(
                            collection(
                                db,
                                "support_messages",
                                ticketDoc.id,
                                "messages"
                            ),
                            {
                                uid: currentUser.uid,
                                text,
                                createdAt: serverTimestamp()
                            }
                        );

                        await updateDoc(
                            ticketDoc.ref,
                            { status: "Répondu" }
                        );

                        await chargerTickets();

                    } catch (error) {
                        alert(error.message);
                    } finally {
                        bouton.disabled = false;
                    }
                });

                const fermer = element("button", "Fermer");

                fermer.addEventListener("click", async () => {
                    await updateDoc(
                        ticketDoc.ref,
                        { status: "Fermé" }
                    );

                    await chargerTickets();
                });

                carte.append(textarea, bouton, fermer);

            } else {
                const rouvrir = element("button", "Rouvrir");

                rouvrir.addEventListener("click", async () => {
                    await updateDoc(
                        ticketDoc.ref,
                        { status: "En attente" }
                    );

                    await chargerTickets();
                });

                carte.appendChild(rouvrir);
            }

            const supprimer = element("button", "Supprimer");
            supprimer.className = "danger";

            supprimer.addEventListener("click", async () => {
                if (!confirm("Supprimer ce ticket ?")) return;

                for (const message of messages.docs) {
                    await deleteDoc(message.ref);
                }

                await deleteDoc(ticketDoc.ref);
                await chargerTickets();
            });

            carte.appendChild(supprimer);
            container.appendChild(carte);
        }

    } catch (error) {
        container.textContent = "Erreur : " + error.message;
    }
}

$("refreshTickets").addEventListener("click", chargerTickets);

/* ACTUALITÉS */

async function chargerActualites() {
    const container = $("newsList");

    try {
        const snapshot = await getDocs(
            collection(db, "news")
        );

        container.replaceChildren();

        for (const item of snapshot.docs) {
            const actualite = item.data();

            const carte = element("article");
            carte.className = "item";

            carte.append(
                element("h3", actualite.title),
                element("p", actualite.content)
            );

            const supprimer = element("button", "Supprimer");
            supprimer.className = "danger";

            supprimer.addEventListener("click", async () => {
                if (!confirm("Supprimer cette actualité ?")) return;

                await deleteDoc(item.ref);
                await chargerActualites();
            });

            carte.appendChild(supprimer);
            container.appendChild(carte);
        }

    } catch (error) {
        container.textContent = error.message;
    }
}

$("newsForm").addEventListener("submit", async event => {
    event.preventDefault();

    try {
        await addDoc(
            collection(db, "news"),
            {
                title: $("newsTitle").value.trim(),
                category: $("newsCategory").value,
                content: $("newsContent").value.trim(),
                authorUid: currentUser.uid,
                createdAt: serverTimestamp()
            }
        );

        $("newsForm").reset();

        notify("Actualité publiée !");
        await chargerActualites();

    } catch (error) {
        alert(error.message);
    }
});

/* SONDAGES */

function ajouterOption(valeur = "") {
    const container = $("pollOptions");

    if (container.children.length >= 10) {
        alert("Maximum 10 réponses.");
        return;
    }

    const ligne = element("div");
    ligne.className = "option-row";

    const input = document.createElement("input");
    input.value = valeur;
    input.maxLength = 150;
    input.placeholder = "Réponse possible";
    input.required = true;

    const supprimer = element("button", "❌");
    supprimer.type = "button";

    supprimer.addEventListener("click", () => {
        if (container.children.length <= 2) {
            alert("Il faut au moins deux réponses.");
            return;
        }

        ligne.remove();
    });

    ligne.append(input, supprimer);
    container.appendChild(ligne);
}

function reinitialiserSondage() {
    editingPoll = null;

    $("pollForm").reset();
    $("pollOptions").replaceChildren();

    ajouterOption();
    ajouterOption();

    $("savePoll").textContent = "Publier le sondage";
    $("cancelPoll").classList.add("hidden");
}

$("addOption").addEventListener("click", () => {
    ajouterOption();
});

$("cancelPoll").addEventListener(
    "click",
    reinitialiserSondage
);

async function chargerSondages() {
    const container = $("pollList");

    try {
        const snapshot = await getDocs(
            collection(db, "polls")
        );

        container.replaceChildren();

        for (const item of snapshot.docs) {
            const sondage = item.data();

            const carte = element("article");
            carte.className = "item";

            carte.appendChild(
                element("h3", sondage.question)
            );

            sondage.options.forEach((option, index) => {
                carte.appendChild(
                    element(
                        "p",
                        (index + 1) + ". " + option
                    )
                );
            });

            const modifier = element("button", "Modifier");

            modifier.addEventListener("click", async () => {
                const votes = await getDocs(
                    collection(db, "polls", item.id, "votes")
                );

                editingPoll = item.id;

                $("pollQuestion").value = sondage.question;

                $("pollOptions").replaceChildren();

                sondage.options.forEach(option => {
                    ajouterOption(option);
                });

                // Les options sont verrouillées si des votes existent.
                if (!votes.empty) {
                    $("pollOptions")
                        .querySelectorAll("input,button")
                        .forEach(champ => {
                            champ.disabled = true;
                        });

                    $("addOption").disabled = true;

                    alert(
                        "Ce sondage possède déjà des votes. " +
                        "Seule sa question peut être modifiée."
                    );
                } else {
                    $("addOption").disabled = false;
                }

                $("savePoll").textContent =
                    "Enregistrer les modifications";

                $("cancelPoll").classList.remove("hidden");

                $("pollForm").scrollIntoView({
                    behavior: "smooth"
                });
            });

            const supprimer = element("button", "Supprimer");
            supprimer.className = "danger";

            supprimer.addEventListener("click", async () => {
                if (!confirm("Supprimer ce sondage ?")) return;

                const votes = await getDocs(
                    collection(db, "polls", item.id, "votes")
                );

                for (const vote of votes.docs) {
                    await deleteDoc(vote.ref);
                }

                await deleteDoc(item.ref);

                await chargerSondages();
            });

            carte.append(modifier, supprimer);
            container.appendChild(carte);
        }

    } catch (error) {
        container.textContent = error.message;
    }
}

$("pollForm").addEventListener("submit", async event => {
    event.preventDefault();

    const question = $("pollQuestion").value.trim();

    const options = Array.from(
        $("pollOptions").querySelectorAll("input")
    ).map(input => input.value.trim());

    if (
        question.length < 5 ||
        options.length < 2 ||
        options.some(option => !option)
    ) {
        alert("Vérifiez la question et les réponses.");
        return;
    }

    try {
        if (editingPoll) {
            const votes = await getDocs(
                collection(
                    db,
                    "polls",
                    editingPoll,
                    "votes"
                )
            );

            const modifications = votes.empty
                ? { question, options }
                : { question };

            await updateDoc(
                doc(db, "polls", editingPoll),
                modifications
            );

            notify("Sondage modifié.");

        } else {
            await addDoc(
                collection(db, "polls"),
                {
                    question,
                    options,
                    authorUid: currentUser.uid,
                    createdAt: serverTimestamp()
                }
            );

            notify("Sondage publié !");
        }

        $("addOption").disabled = false;

        reinitialiserSondage();
        await chargerSondages();

    } catch (error) {
        alert(error.message);
    }
});

/* MAINTENANCE */

const maintenanceRef = doc(
    db,
    "site_settings",
    "maintenance"
);

function surveillerMaintenance() {
    onSnapshot(maintenanceRef, snapshot => {
        if (maintenanceTimer) {
            clearInterval(maintenanceTimer);
        }

        const data = snapshot.data();

        if (!data?.active) {
            $("maintenanceStatus").textContent =
                "🟢 Site disponible";

            $("countdown").textContent = "";
            return;
        }

        const fin = data.endsAt?.toDate?.();

        function actualiser() {
            if (!fin) return;

            const secondes = Math.max(
                0,
                Math.ceil((fin.getTime() - Date.now()) / 1000)
            );

            if (secondes === 0) {
                $("maintenanceStatus").textContent =
                    "🟢 Maintenance terminée";

                $("countdown").textContent = "00:00:00";
                clearInterval(maintenanceTimer);
                return;
            }

            $("maintenanceStatus").textContent =
                "🔴 Maintenance en cours";

            const h = Math.floor(secondes / 3600);
            const m = Math.floor((secondes % 3600) / 60);
            const s = secondes % 60;

            $("countdown").textContent =
                String(h).padStart(2, "0") + ":" +
                String(m).padStart(2, "0") + ":" +
                String(s).padStart(2, "0");
        }

        actualiser();

        maintenanceTimer = setInterval(actualiser, 1000);
    });
}

$("startMaintenance").addEventListener("click", async () => {
    const minutes = Number($("duration").value);

    await setDoc(
        maintenanceRef,
        {
            active: true,
            endsAt: Timestamp.fromDate(
                new Date(Date.now() + minutes * 60000)
            ),
            updatedAt: serverTimestamp()
        }
    );
});

$("stopMaintenance").addEventListener("click", async () => {
    await setDoc(
        maintenanceRef,
        {
            active: false,
            endsAt: null,
            updatedAt: serverTimestamp()
        }
    );
});

/* CONNEXION */

onAuthStateChanged(auth, async user => {
    currentUser = user;

    if (!admin(user)) {
        $("access").textContent = user
            ? "⛔ Accès réservé aux administrateurs."
            : "Connectez-vous pour accéder à l'administration.";

        $("dashboard").classList.add("hidden");
        return;
    }

    $("access").classList.add("hidden");
    $("dashboard").classList.remove("hidden");

    reinitialiserSondage();

    await Promise.all([
        chargerProfil(),
        chargerTickets(),
        chargerActualites(),
        chargerSondages()
    ]);

    surveillerMaintenance();
});

</script>

</body>
</html>
