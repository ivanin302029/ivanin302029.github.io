<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administration — Mon Bot PC</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0B1120;
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
}

header {
    background: #111827;
    border-bottom: 1px solid #334155;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

header h1 {
    margin: 0;
    font-size: 24px;
    color: #60A5FA;
}

a {
    color: #60A5FA;
    text-decoration: none;
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

.card {
    background: #172033;
    border: 1px solid #334155;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
}

h2 { color: #60A5FA; }

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: #0B1120;
    color: white;
    border: 1px solid #334155;
    border-radius: 9px;
    font-family: inherit;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    background: #3B82F6;
    color: white;
    padding: 12px 18px;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    margin: 5px;
    font-weight: bold;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.danger { background: #DC2626; }
.success { background: #16A34A; }
.warning { background: #D97706; }

.item {
    background: #0B1120;
    border: 1px solid #334155;
    padding: 20px;
    margin: 15px 0;
    border-radius: 12px;
    overflow-wrap: anywhere;
}

.small {
    color: #94A3B8;
    font-size: 13px;
}

.conversation {
    background: #111827;
    padding: 15px;
    border-radius: 12px;
    margin: 15px 0;
    max-height: 450px;
    overflow-y: auto;
}

.bubble {
    padding: 12px;
    border-radius: 12px;
    margin: 12px 0;
    max-width: 90%;
    overflow-wrap: anywhere;
}

.bubble p {
    white-space: pre-wrap;
    line-height: 1.6;
}

.from-user {
    background: #334155;
    margin-right: auto;
}

.from-admin {
    background: #1D4ED8;
    margin-left: auto;
}

.file-link {
    display: block;
    margin-top: 10px;
    color: #93C5FD;
}

#dashboard {
    display: none;
}

#countdown {
    font-size: 42px;
    font-weight: bold;
    color: #22C55E;
    font-variant-numeric: tabular-nums;
}

#notice {
    margin: 15px 0;
    color: #22C55E;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
    <h1>⚙️ Mon Bot PC — Administration</h1>
    <a href="index.html">← Retour au site</a>
</header>

<main>

<div id="access" class="card">
    Vérification de l'administrateur...
</div>

<div id="dashboard">

<section class="card">

    <h2>📩 Assistance — Conversations</h2>

    <button id="refreshTickets">
        ↻ Actualiser les tickets
    </button>

    <div id="tickets"></div>

</section>

<section class="card">

    <h2>📰 Publier une actualité</h2>

    <form id="newsForm">

        <input
            id="newsTitle"
            placeholder="Titre de l'actualité"
            maxlength="150"
            required
        >

        <select id="newsCategory">
            <option>Mise à jour</option>
            <option>Annonce</option>
            <option>Maintenance</option>
            <option>Information</option>
        </select>

        <textarea
            id="newsContent"
            placeholder="Contenu de l'actualité"
            maxlength="10000"
            required
        ></textarea>

        <button type="submit">
            📢 Publier
        </button>

    </form>

    <h2>Actualités publiées</h2>

    <div id="newsList"></div>

</section>

<section class="card">

    <h2>🔧 Maintenance</h2>

    <select id="duration">
        <option value="30">30 minutes</option>
        <option value="60">1 heure</option>
        <option value="120">2 heures</option>
        <option value="360">6 heures</option>
        <option value="720">12 heures</option>
        <option value="1440">24 heures</option>
    </select>

    <button id="startMaintenance" class="danger">
        Activer la maintenance
    </button>

    <button id="stopMaintenance" class="success">
        Désactiver la maintenance
    </button>

    <h3 id="maintenanceStatus"></h3>

    <div id="countdown"></div>

</section>

</div>

<div id="notice" role="status"></div>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDocs,
    addDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    Timestamp,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGF2FYnntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    messagingSenderId: "691729637594",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const ADMIN_UID = "rWEk3vGHK1W2EDvemVfw6xNtKxU2";
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const access = document.getElementById("access");
const dashboard = document.getElementById("dashboard");
const notice = document.getElementById("notice");

const ticketsContainer = document.getElementById("tickets");
const newsContainer = document.getElementById("newsList");

const maintenanceRef = doc(
    db,
    "site_settings",
    "maintenance"
);

let maintenanceTimer = null;
let unsubscribeMaintenance = null;

const allowedTypes = [
    "image/png",
    "image/jpeg",
    "image/webp",
    "application/pdf",
    "text/plain"
];

function notify(text, error = false) {
    notice.textContent = text;
    notice.style.color = error ? "#EF4444" : "#22C55E";
}

function make(tag, text = "", className = "") {
    const element = document.createElement(tag);
    element.textContent = text;
    element.className = className;
    return element;
}

function formatDate(timestamp) {
    return timestamp?.toDate
        ? timestamp.toDate().toLocaleString("fr-CA")
        : "";
}

function validateFile(file) {

    if (!file) return;

    if (!allowedTypes.includes(file.type)) {
        throw new Error("Type de fichier non autorisé.");
    }

    if (file.size > 5 * 1024 * 1024) {
        throw new Error("Maximum 5 Mo.");
    }
}

async function uploadAttachment(ticketId, messageId, file) {

    validateFile(file);

    const extension = {
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/webp": "webp",
        "application/pdf": "pdf",
        "text/plain": "txt"
    }[file.type];

    const path =
        `tickets/${ticketId}/${messageId}/piece-jointe.${extension}`;

    await uploadBytes(
        ref(storage, path),
        file,
        { contentType: file.type }
    );

    return {
        path,
        name: file.name
    };
}

function addFileLink(container, data) {

    if (!data.attachmentPath) return;

    const link = make(
        "a",
        "📎 " + (data.attachmentName || "Pièce jointe"),
        "file-link"
    );

    link.href = "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.addEventListener("click", async event => {

        event.preventDefault();

        try {

            const url = await getDownloadURL(
                ref(storage, data.attachmentPath)
            );

            window.open(url, "_blank", "noopener,noreferrer");

        } catch (error) {

            console.error(error);
            alert("Impossible d'ouvrir le fichier.");
        }
    });

    container.append(link);
}

async function loadConversation(ticket, container) {

    container.textContent = "Chargement...";

    try {

        const snapshot = await getDocs(
            collection(
                db,
                "support_messages",
                ticket.id,
                "messages"
            )
        );

        const messages = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
        }));

        messages.sort((a, b) =>
            (a.createdAt?.seconds || 0) -
            (b.createdAt?.seconds || 0)
        );

        container.replaceChildren();

        const original = make(
            "div",
            "",
            "bubble from-user"
        );

        original.append(
            make("strong", "👤 Message initial"),
            make("p", ticket.content || "")
        );

        container.append(original);

        if (ticket.reply) {

            const oldReply = make(
                "div",
                "",
                "bubble from-admin"
            );

            oldReply.append(
                make("strong", "🛠️ Ancienne réponse"),
                make("p", ticket.reply)
            );

            container.append(oldReply);
        }

        messages.forEach(message => {

            const isAdmin = message.uid === ADMIN_UID;

            const bubble = make(
                "div",
                "",
                "bubble " + (
                    isAdmin ? "from-admin" : "from-user"
                )
            );

            bubble.append(
                make(
                    "strong",
                    isAdmin
                        ? "🛠️ Vous — Assistance"
                        : "👤 Utilisateur"
                ),
                make("p", message.text || ""),
                make(
                    "div",
                    formatDate(message.createdAt),
                    "small"
                )
            );

            addFileLink(bubble, message);

            container.append(bubble);
        });

        container.scrollTop = container.scrollHeight;

    } catch (error) {

        console.error(error);
        container.textContent =
            "Impossible de charger la conversation.";
    }
}

async function sendReply(
    ticket,
    textarea,
    fileInput,
    button,
    conversation
) {

    const text = textarea.value.trim();
    const file = fileInput.files[0];

    if (!text && !file) {
        alert("Écris un message ou joins un fichier.");
        return;
    }

    try {
        validateFile(file);
    } catch (error) {
        alert(error.message);
        return;
    }

    button.disabled = true;

    try {

        const messagesRef = collection(
            db,
            "support_messages",
            ticket.id,
            "messages"
        );

        const messageRef = doc(messagesRef);

        let attachment = null;

        if (file) {
            attachment = await uploadAttachment(
                ticket.id,
                messageRef.id,
                file
            );
        }

        const data = {
            uid: ADMIN_UID,
            text,
            createdAt: serverTimestamp()
        };

        if (attachment) {
            data.attachmentPath = attachment.path;
            data.attachmentName = attachment.name;
        }

        await addDoc(messagesRef, data);

        textarea.value = "";
        fileInput.value = "";

        notify("Message envoyé !");

        await loadConversation(ticket, conversation);

    } catch (error) {

        console.error(error);
        notify("Erreur d'envoi : " + error.message, true);

    } finally {

        button.disabled = false;
    }
}

async function deleteTicket(ticket) {

    if (!confirm(
        "Supprimer définitivement ce ticket et sa conversation ?"
    )) return;

    try {

        const messagesRef = collection(
            db,
            "support_messages",
            ticket.id,
            "messages"
        );

        const snapshot = await getDocs(messagesRef);

        for (const item of snapshot.docs) {

            const data = item.data();

            if (data.attachmentPath) {

                try {
                    await deleteObject(
                        ref(storage, data.attachmentPath)
                    );
                } catch (error) {
                    console.warn("Fichier non supprimé :", error);
                }
            }

            await deleteDoc(item.ref);
        }

        await deleteDoc(
            doc(db, "support_messages", ticket.id)
        );

        notify("Ticket supprimé.");

        await loadTickets();

    } catch (error) {

        console.error(error);

        notify("Erreur de suppression : " + error.message, true);
    }
}

async function changeStatus(ticket, status) {

    try {

        await updateDoc(
            doc(db, "support_messages", ticket.id),
            { status }
        );

        notify("Statut modifié.");

        await loadTickets();

    } catch (error) {

        console.error(error);

        notify("Erreur : " + error.message, true);
    }
}

async function loadTickets() {

    ticketsContainer.textContent = "Chargement des tickets...";

    try {

        const snapshot = await getDocs(
            collection(db, "support_messages")
        );

        const tickets = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
        }));

        tickets.sort((a, b) =>
            (b.createdAt?.seconds || 0) -
            (a.createdAt?.seconds || 0)
        );

        ticketsContainer.replaceChildren();

        if (!tickets.length) {
            ticketsContainer.textContent = "Aucun ticket.";
            return;
        }

        tickets.forEach(ticket => {

            const card = make("article", "", "item");

            card.append(
                make("h3", ticket.title || "Sans titre"),
                make("p", "👤 " + (ticket.email || "")),
                make("p", "Sujet : " + ticket.subject),
                make("p", "Statut : " + ticket.status)
            );

            const conversation = make(
                "div",
                "",
                "conversation"
            );

            card.append(conversation);

            loadConversation(ticket, conversation);

            if (ticket.status !== "Fermé") {

                const textarea = document.createElement("textarea");

                textarea.placeholder = "Répondre à l'utilisateur...";
                textarea.maxLength = 3000;

                const fileInput = document.createElement("input");

                fileInput.type = "file";

                fileInput.accept =
                    ".png,.jpg,.jpeg,.webp,.pdf,.txt";

                const button = make(
                    "button",
                    "💬 Envoyer la réponse"
                );

                button.addEventListener("click", () => {

                    sendReply(
                        ticket,
                        textarea,
                        fileInput,
                        button,
                        conversation
                    );
                });

                const closeButton = make(
                    "button",
                    "🔒 Fermer",
                    "warning"
                );

                closeButton.addEventListener("click", () => {
                    changeStatus(ticket, "Fermé");
                });

                card.append(
                    textarea,
                    fileInput,
                    button,
                    closeButton
                );

            } else {

                const reopenButton = make(
                    "button",
                    "🔓 Rouvrir",
                    "success"
                );

                reopenButton.addEventListener("click", () => {
                    changeStatus(ticket, "En attente");
                });

                card.append(reopenButton);
            }

            const deleteButton = make(
                "button",
                "🗑️ Supprimer",
                "danger"
            );

            deleteButton.addEventListener("click", () => {
                deleteTicket(ticket);
            });

            card.append(deleteButton);

            ticketsContainer.append(card);
        });

    } catch (error) {

        console.error(error);

        ticketsContainer.textContent =
            "Impossible de charger les tickets.";
    }
}

async function loadNews() {

    newsContainer.textContent = "Chargement...";

    try {

        const snapshot = await getDocs(
            collection(db, "news")
        );

        const articles = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
        }));

        articles.sort((a, b) =>
            (b.createdAt?.seconds || 0) -
            (a.createdAt?.seconds || 0)
        );

        newsContainer.replaceChildren();

        articles.forEach(article => {

            const card = make("div", "", "item");

            card.append(
                make("h3", article.title || ""),
                make("p", article.category || ""),
                make("p", article.content || "")
            );

            const deleteButton = make(
                "button",
                "Supprimer",
                "danger"
            );

            deleteButton.addEventListener("click", async () => {

                if (!confirm("Supprimer cette actualité ?")) return;

                try {

                    await deleteDoc(
                        doc(db, "news", article.id)
                    );

                    await loadNews();

                } catch (error) {

                    notify(error.message, true);
                }
            });

            card.append(deleteButton);

            newsContainer.append(card);
        });

        if (!articles.length) {
            newsContainer.textContent = "Aucune actualité.";
        }

    } catch (error) {

        console.error(error);

        newsContainer.textContent =
            "Impossible de charger les actualités.";
    }
}

document.getElementById("newsForm")
.addEventListener("submit", async event => {

    event.preventDefault();

    const title = document.getElementById("newsTitle").value.trim();
    const category = document.getElementById("newsCategory").value;
    const content = document.getElementById("newsContent").value.trim();

    if (!title || !content) return;

    try {

        await addDoc(
            collection(db, "news"),
            {
                title,
                category,
                content,
                createdAt: serverTimestamp()
            }
        );

        document.getElementById("newsForm").reset();

        notify("Actualité publiée !");

        await loadNews();

    } catch (error) {

        notify("Erreur : " + error.message, true);
    }
});

function watchMaintenance() {

    if (unsubscribeMaintenance) {
        unsubscribeMaintenance();
    }

    unsubscribeMaintenance = onSnapshot(
        maintenanceRef,
        snapshot => {

            const data = snapshot.exists()
                ? snapshot.data()
                : null;

            if (maintenanceTimer) {
                clearInterval(maintenanceTimer);
            }

            const status = document.getElementById(
                "maintenanceStatus"
            );

            const countdown = document.getElementById(
                "countdown"
            );

            if (!data?.active) {

                status.textContent = "🟢 Site disponible";
                countdown.textContent = "";

                return;
            }

            const endDate = data.endsAt?.toDate?.();

            function tick() {

                if (!endDate) {
                    countdown.textContent = "Date inconnue";
                    return;
                }

                const seconds = Math.max(
                    0,
                    Math.ceil(
                        (endDate.getTime() - Date.now()) / 1000
                    )
                );

                if (seconds === 0) {
                    status.textContent = "🟢 Maintenance terminée";
                    countdown.textContent = "00:00:00";
                    clearInterval(maintenanceTimer);
                    return;
                }

                status.textContent = "🔴 Maintenance en cours";

                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;

                countdown.textContent =
                    String(h).padStart(2, "0") + ":" +
                    String(m).padStart(2, "0") + ":" +
                    String(s).padStart(2, "0");
            }

            tick();

            maintenanceTimer = setInterval(tick, 1000);
        }
    );
}

document.getElementById("startMaintenance")
.addEventListener("click", async () => {

    const minutes = Number(
        document.getElementById("duration").value
    );

    try {

        await setDoc(
            maintenanceRef,
            {
                active: true,
                endsAt: Timestamp.fromDate(
                    new Date(Date.now() + minutes * 60000)
                ),
                updatedAt: serverTimestamp()
            }
        );

        notify("Maintenance activée.");

    } catch (error) {

        notify(error.message, true);
    }
});

document.getElementById("stopMaintenance")
.addEventListener("click", async () => {

    try {

        await setDoc(
            maintenanceRef,
            {
                active: false,
                endsAt: null,
                updatedAt: serverTimestamp()
            }
        );

        notify("Maintenance désactivée.");

    } catch (error) {

        notify(error.message, true);
    }
});

document.getElementById("refreshTickets")
.addEventListener("click", loadTickets);

onAuthStateChanged(auth, async user => {

    if (!user) {

        access.replaceChildren();

        const text = make(
            "p",
            "Connectez-vous pour accéder à l'administration."
        );

        const link = make("a", "Se connecter");

        link.href = "connexion.html";

        access.append(text, link);

        dashboard.style.display = "none";

        return;
    }

    if (user.uid !== ADMIN_UID) {

        access.textContent =
            "⛔ Accès refusé : administrateur uniquement.";

        dashboard.style.display = "none";

        return;
    }

    access.style.display = "none";
    dashboard.style.display = "block";

    await Promise.all([
        loadTickets(),
        loadNews()
    ]);

    watchMaintenance();
});

</script>

</body>
</html>
