<script type="module">
import { initializeApp }
    from "https://gstatic.com";

import {
    getAuth,
    onAuthStateChanged
} from "https://gstatic.com";

import {
    getFirestore,
    collection,
    doc,
    getDocs,
    getDoc,
    setDoc,
    deleteDoc,
    updateDoc,
    query,
    orderBy,
    limit,
    onSnapshot,
    serverTimestamp
} from "https://gstatic.com";


/* =========================
   CONFIGURATION FIREBASE
   ========================= */

const firebaseConfig = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGFf2YNntQ7upfdWE",
    authDomain: "://firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    messagingSenderId: "691729637594",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* =========================
   ÉTAT DE L'APPLICATION
   ========================= */

let utilisateurActuel = null;
let estAdmin = false;
let desabonnementSondages = null;

const el = (tag, text = "") => {
    const element = document.createElement(tag);
    if (text !== "") element.textContent = text;
    return element;
};

function afficherErreur(element, message) {
    element.textContent = message;
    element.classList.add("status-error");
}

function afficherSucces(element, message) {
    element.textContent = message;
    element.classList.remove("status-error");
}

function nettoyerPseudo(pseudo) {
    return String(pseudo || "").trim().replace(/\s+/g, " ");
}

function messageErreurFirestore(error) {
    console.error(error);
    if (error?.code === "permission-denied") {
        return "Accès refusé par Firestore. Vérifiez vos règles de sécurité ou votre UID administrateur.";
    }
    if (error?.code === "unavailable") {
        return "Firebase est momentanément indisponible.";
    }
    return "Une erreur est survenue avec la base de données.";
}


/* =========================
   AUTHENTIFICATION
   ========================= */

async function verifierAdministrateur(user) {
    if (!user) return false;
    try {
        const adminRef = doc(db, "admins", user.uid);
        const adminSnapshot = await getDoc(adminRef);
        return adminSnapshot.exists();
    } catch (error) {
        console.error("Vérification administrateur impossible :", error);
        return false;
    }
}

onAuthStateChanged(auth, async (user) => {
    utilisateurActuel = user;
    const statusEl = document.getElementById("auth-status");
    const adminPanel = document.getElementById("admin-panel");

    if (user) {
        statusEl.textContent = `Connecté en tant que : ${user.email || user.uid}`;
        estAdmin = await verifierAdministrateur(user);
        if (estAdmin) {
            adminPanel.removeAttribute("hidden");
        } else {
            adminPanel.setAttribute("hidden", "true");
        }
    } else {
        statusEl.textContent = "Mode invité — Connectez-vous sur la page d'accueil pour pouvoir voter.";
        estAdmin = false;
        adminPanel.setAttribute("hidden", "true");
    }

    chargerActualites();
    ecouterSondagesEnTempsReel();
});


/* =========================
   GESTION DES ACTUALITÉS (NEWS)
   ========================= */

async function chargerActualites() {
    const container = document.getElementById("news-container");
    container.textContent = "Chargement des actualités...";

    try {
        const newsQuery = query(collection(db, "news"), orderBy("date", "desc"), limit(10));
        const querySnapshot = await getDocs(newsQuery);

        container.innerHTML = "";
        if (querySnapshot.empty) {
            container.textContent = "Aucune actualité publiée pour le moment.";
            return;
        }

        querySnapshot.forEach((docSnap) => {
            const act = docSnap.data();
            const card = el("div");
            card.className = "card";

            const titre = el("h3", act.titre || "Actualité");
            const contenu = el("p", act.contenu || "");
            
            card.appendChild(titre);
            card.appendChild(contenu);
            container.appendChild(card);
        });
    } catch (error) {
        afficherErreur(container, messageErreurFirestore(error));
    }
}


/* =========================
   LOGIQUE SONDAGES (STYLE DISCORD)
   ========================= */

function ecouterSondagesEnTempsReel() {
    if (desabonnementSondages) desabonnementSondages();

    const container = document.getElementById("polls-container");
    container.textContent = "Chargement des sondages...";

    const pollsQuery = query(collection(db, "polls"), orderBy("creeLe", "desc"));

    desabonnementSondages = onSnapshot(pollsQuery, (querySnapshot) => {
        container.innerHTML = "";

        if (querySnapshot.empty) {
            container.textContent = "Aucun sondage disponible.";
            return;
        }

        querySnapshot.forEach((docSnap) => {
            const pollId = docSnap.id;
            const pollData = docSnap.data();
            
            const card = el("div");
            card.className = "card";

            const question = el("h3", pollData.question);
            card.appendChild(question);

            const optionsContainer = el("div");
            card.appendChild(optionsContainer);
            container.appendChild(card);

            const votesRef = collection(db, "polls", pollId, "votes");
            onSnapshot(votesRef, (votesSnapshot) => {
                optionsContainer.innerHTML = "";
                
                const listVotes = [];
                let utilisateurVoteDoc = null;

                votesSnapshot.forEach((vSnap) => {
                    const vData = vSnap.data();
                    listVotes.push(vData);
                    if (utilisateurActuel && vSnap.id === utilisateurActuel.uid) {
                        utilisateurVoteDoc = vData;
                    }
                });

                const totalVotes = listVotes.length;

                const stats = {};
                pollData.options.forEach((_, idx) => stats[idx] = 0);
                listVotes.forEach(v => {
                    if (stats.hasOwnProperty(v.optionIndex)) {
                        stats[v.optionIndex]++;
                    }
                });

                const aVote = utilisateurVoteDoc !== null;

                pollData.options.forEach((opt, index) => {
                    const count = stats[index] || 0;
                    const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                    const utilisateurAVotePourCa = aVote && utilisateurVoteDoc.optionIndex === index;

                    const row = el("div");
                    row.className = "poll-result-row";
                    row.style.cursor = utilisateurActuel ? "pointer" : "not-allowed";

                    if (utilisateurAVotePourCa) {
                        row.style.borderLeft = "4px solid var(--accent)";
                        row.style.paddingLeft = "8px";
                    }

                    const title = el("div");
                    title.className = "poll-result-title";

                    const labelSpan = el("span", opt);
                    if (utilisateurAVotePourCa) labelSpan.style.fontWeight = "bold";

                    const countSpan = el("span", `${count} vote(s) (${pct}%)`);
                    title.appendChild(labelSpan);
                    title.appendChild(countSpan);

                    const track = el("div");
                    track.className = "poll-progress-track";

                    const bar = el("div");
                    bar.className = "poll-progress-bar";
                    bar.style.width = `${pct}%`;
                    bar.style.background = utilisateurAVotePourCa ? "var(--accent)" : "#4B5563";

                    track.appendChild(bar);
                    row.appendChild(title);
                    row.appendChild(track);

                    if (utilisateurActuel) {
                        row.addEventListener("click", async () => {
                            const userVoteRef = doc(db, "polls", pollId, "votes", utilisateurActuel.uid);
                            
                            if (utilisateurAVotePourCa) {
                                await deleteDoc(userVoteRef);
                            } else {
                                const monPseudo = nettoyerPseudo(utilisateurActuel.displayName || utilisateurActuel.email || "Anonyme");
                                await setDoc(userVoteRef, {
                                    uid: utilisateurActuel.uid,
                                    pseudo: monPseudo.substring(0, 24),
                                    optionIndex: parseInt(index)
                                });
                            }
                        });
                    }

                    optionsContainer.appendChild(row);
                });

                const totalEl = el("p", `Total : ${totalVotes} participant(s)`);
                totalEl.className = "poll-total-votes";
                optionsContainer.appendChild(totalEl);

                if (estAdmin) {
                    const btnSuppr = el("button", "🗑️ Supprimer le sondage");
                    btnSuppr.className = "danger";
                    btnSuppr.style.marginTop = "15px";
                    btnSuppr.onclick = async (e) => {
                        e.stopPropagation();
                        if (confirm("Supprimer définitivement ce sondage ?")) {
                            await deleteDoc(doc(db, "polls", pollId));
                        }
                    };
                    optionsContainer.appendChild(btnSuppr);
                }
            });
        });
    }, (error) => {
afficherErreur(container, messageErreurFirestore(error));
});
}
/* =========================
TRAITEMENT DU FORMULAIRE D'ORIGINE
========================= */
document.getElementById("create-poll-form").addEventListener("submit", async (e) => {
e.preventDefault();
const statusEl = document.getElementById("create-poll-status");
const questionInput = document.getElementById("new-poll-question");
const optionsInput = document.getElementById("new-poll-options");
const question = questionInput.value.trim();
const options = optionsInput.value.split("\n")
.map(o => o.trim())
.filter(o => o.length > 0);
if (options.length < 2 || options.length > 6) {
afficherErreur(statusEl, "Il faut renseigner entre 2 et 6 réponses (une par ligne).");
return;
}
try {
const idUnique = "poll_" + Math.random().toString(36).substring(2, 11);
await setDoc(doc(db, "polls", idUnique), {
question: question,
options: options,
authorUid: utilisateurActuel.uid,
creeLe: serverTimestamp()
});
afficherSucces(statusEl, "Sondage créé avec succès !");
questionInput.value = "";
optionsInput.value = "";
} catch (error) {
afficherErreur(statusEl, "Impossible de créer le sondage. Droits insuffisants ou structure invalide.");
}
});
document.getElementById("refresh-button").addEventListener("click", () => {
chargerActualites();
});
