<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Actualités — Mon Bot PC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0B1120;
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 25px;
}

main {
    max-width: 950px;
    margin: auto;
}

a {
    color: #60A5FA;
    text-decoration: none;
}

h1, h2 {
    color: #60A5FA;
}

.card {
    background: #172033;
    border: 1px solid #334155;
    padding: 25px;
    margin: 20px 0;
    border-radius: 15px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    background: #334155;
}

.small {
    color: #94A3B8;
    font-size: 13px;
}

.content {
    white-space: pre-wrap;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.option {
    display: block;
    background: #1E293B;
    padding: 13px;
    border-radius: 9px;
    margin: 10px 0;
    cursor: pointer;
}

button {
    background: #3B82F6;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

.result {
    background: #334155;
    border-radius: 8px;
    overflow: hidden;
    margin: 10px 0;
}

.bar {
    background: #2563EB;
    padding: 8px;
    min-width: 2px;
}
</style>

</head>

<body>

<main>

<a href="index.html">← Retour à l'accueil</a>

<h1>📰 Actualités Mon Bot PC</h1>

<button id="refresh">↻ Actualiser</button>

<h2>Dernières actualités</h2>

<div id="news">Chargement...</div>

<h2>📊 Sondages</h2>

<div id="polls">Chargement...</div>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const config = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGF2FYnntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const app = initializeApp(config);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

const ADMINS = [
    "rWEk3vGHK1W2EDvemVfw6xNtKxU2",
    "8lq3zxa8nkdZ6hXpa8FeZTpI55Q2"
];

function element(tag, text = "") {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
}

async function chargerProfils() {
    const profils = {};

    for (const uid of ADMINS) {
        try {
            const snapshot = await getDoc(
                doc(db, "admin_profiles", uid)
            );

            if (snapshot.exists()) {
                profils[uid] = snapshot.data();
            }
        } catch (error) {
            console.warn(error);
        }
    }

    return profils;
}

function afficherProfil(uid, profils) {
    const profil = profils[uid] || {};

    const cadre = element("div");
    cadre.className = "profile";

    if (profil.avatarUrl?.startsWith("https://")) {
        const image = document.createElement("img");

        image.src = profil.avatarUrl;
        image.className = "avatar";
        image.alt = "Photo de profil";

        image.onerror = () => {
            image.replaceWith(element("span", "👤"));
        };

        cadre.appendChild(image);
    } else {
        cadre.appendChild(element("span", "👤"));
    }

    cadre.appendChild(
        element(
            "strong",
            profil.nickname || "Équipe Mon Bot PC"
        )
    );

    return cadre;
}

async function chargerActualites(profils) {
    const container = document.getElementById("news");

    const snapshot = await getDocs(
        collection(db, "news")
    );

    const actualites = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
    }));

    actualites.sort((a, b) =>
        (b.createdAt?.seconds || 0) -
        (a.createdAt?.seconds || 0)
    );

    container.replaceChildren();

    if (!actualites.length) {
        container.textContent = "Aucune actualité.";
    }

    for (const actualite of actualites) {
        const carte = element("article");
        carte.className = "card";

        carte.appendChild(
            afficherProfil(actualite.authorUid, profils)
        );

        carte.appendChild(
            element("h2", actualite.title || "Sans titre")
        );

        const categorie = element(
            "p",
            actualite.category || "Annonce"
        );

        categorie.className = "small";

        carte.appendChild(categorie);

        const contenu = element(
            "p",
            actualite.content || ""
        );

        contenu.className = "content";

        carte.appendChild(contenu);
        container.appendChild(carte);
    }

    localStorage.setItem(
        "monbotpc_news_lues",
        JSON.stringify(actualites.map(a => a.id))
    );
}

async function chargerSondages(profils) {
    const container = document.getElementById("polls");

    const snapshot = await getDocs(
        collection(db, "polls")
    );

    const sondages = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
    }));

    sondages.sort((a, b) =>
        (b.createdAt?.seconds || 0) -
        (a.createdAt?.seconds || 0)
    );

    container.replaceChildren();

    if (!sondages.length) {
        container.textContent = "Aucun sondage.";
        return;
    }

    for (const sondage of sondages) {
        const carte = element("article");
        carte.className = "card";

        carte.appendChild(
            afficherProfil(sondage.authorUid, profils)
        );

        carte.appendChild(
            element("h2", "📊 " + sondage.question)
        );

        let dejaVote = false;

        if (currentUser) {
            const vote = await getDoc(
                doc(
                    db,
                    "polls",
                    sondage.id,
                    "votes",
                    currentUser.uid
                )
            );

            dejaVote = vote.exists();
        }

        const formulaire = element("form");

        sondage.options.forEach((option, index) => {
            const label = element("label");
            label.className = "option";

            const radio = document.createElement("input");

            radio.type = "radio";
            radio.name = "sondage_" + sondage.id;
            radio.value = index;
            radio.disabled = dejaVote || !currentUser;

            label.append(
                radio,
                document.createTextNode(" " + option)
            );

            formulaire.appendChild(label);
        });

        if (!currentUser) {
            formulaire.appendChild(
                element("p", "Connectez-vous pour voter.")
            );
        } else if (dejaVote) {
            formulaire.appendChild(
                element("p", "✅ Vous avez déjà voté.")
            );
        } else {
            const bouton = element("button", "Voter");
            bouton.type = "submit";

            formulaire.appendChild(bouton);

            formulaire.addEventListener(
                "submit",
                async event => {
                    event.preventDefault();

                    const selection = formulaire.querySelector(
                        "input:checked"
                    );

                    if (!selection) {
                        alert("Choisissez une réponse.");
                        return;
                    }

                    bouton.disabled = true;

                    try {
                        await setDoc(
                            doc(
                                db,
                                "polls",
                                sondage.id,
                                "votes",
                                currentUser.uid
                            ),
                            {
                                uid: currentUser.uid,
                                optionIndex: Number(selection.value),
                                createdAt: serverTimestamp()
                            }
                        );

                        alert("Vote enregistré !");
                        await charger();

                    } catch (error) {
                        alert("Erreur : " + error.message);
                        bouton.disabled = false;
                    }
                }
            );
        }

        carte.appendChild(formulaire);
        container.appendChild(carte);
    }
}

async function charger() {
    try {
        const profils = await chargerProfils();

        await chargerActualites(profils);
        await chargerSondages(profils);

    } catch (error) {
        console.error(error);

        document.getElementById("polls").textContent =
            "Erreur : " + error.message;
    }
}

document.getElementById("refresh")
    .addEventListener("click", charger);

onAuthStateChanged(auth, user => {
    currentUser = user;
    charger();
});

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
