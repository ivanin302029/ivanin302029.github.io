<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1120">
<title>Actualités et sondages — Mon Bot PC</title>

<style>
* { box-sizing: border-box; }

:root {
    color-scheme: dark;
    --background: #0B1120;
    --card: #172033;
    --border: #2D3B55;
    --text: #F1F5F9;
    --muted: #A8B4C8;
    --accent: #60A5FA;
    --green: #34D399;
    --red: #FB7185;
}

body {
    margin: 0;
    padding: 24px;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

header, main, footer, .navigation {
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
}

header { margin-bottom: 28px; }
h1 { font-size: clamp(25px, 5vw, 36px); }
.muted, header p { color: var(--muted); }
section { margin-bottom: 32px; }

.section-title {
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.card {
    margin: 16px 0;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow-wrap: anywhere;
}

button, input, textarea { font: inherit; }

button {
    padding: 11px 16px;
    margin: 5px 5px 5px 0;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #07111F;
    font-weight: bold;
    cursor: pointer;
}

button:hover { filter: brightness(1.1); }
button:disabled { opacity: .55; cursor: not-allowed; }
button.secondary { background: #334155; color: white; }
button.danger { background: var(--red); }

input[type="text"], textarea {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 8px 0 14px;
    color: white;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 8px;
}

textarea { min-height: 100px; resize: vertical; }

.poll-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px;
    margin: 9px 0;
    background: #101A2B;
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
}

.poll-option:hover { border-color: var(--accent); }
.poll-option input { width: 18px; height: 18px; }

.poll-result { margin: 18px 0; }

.poll-result-title {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 7px;
}

.poll-track {
    height: 13px;
    background: #263449;
    border-radius: 20px;
    overflow: hidden;
}

.poll-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 20px;
    transition: width .3s;
}

.poll-total { color: var(--muted); margin-top: 20px; }
.poll-status { color: var(--green); min-height: 20px; }
.error { color: var(--red); }

.admin-panel {
    padding: 18px;
    margin: 20px 0;
    border: 1px dashed var(--accent);
    border-radius: 12px;
}

[hidden] { display: none !important; }

footer {
    margin-top: 35px;
    padding-top: 15px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
}

@media (max-width: 600px) {
    body { padding: 14px; }
    .card { padding: 15px; }
}
</style>
</head>

<body>

<div class="navigation">
    <button class="secondary" onclick="location.href='index.html'">
        🏠 Retour à l'accueil
    </button>
</div>

<header>
    <h1>📰 Actualités et sondages</h1>
    <p>Mon Bot PC — Actualités et sondages de la communauté.</p>
    <p id="auth-status">Vérification de la connexion...</p>
    <button id="refresh-button">🔄 Actualiser</button>
</header>

<main>
    <section>
        <h2 class="section-title">📢 Actualités</h2>
        <div id="news-container">Chargement des actualités...</div>
    </section>

    <section>
        <h2 class="section-title">🗳️ Sondages</h2>

        <div id="admin-panel" class="admin-panel" hidden>
            <h3>Administration des sondages</h3>

            <form id="create-poll-form">
                <label>Question du sondage</label>
                <input id="new-poll-question" type="text" maxlength="250" required>

                <label>Réponses (une par ligne, de 2 à 6)</label>
                <textarea id="new-poll-options" placeholder="Oui&#10;Non" required></textarea>

                <button type="submit">➕ Créer le sondage</button>
                <p id="create-poll-status" class="poll-status"></p>
            </form>
        </div>

        <div id="polls-container">Chargement des sondages...</div>
    </section>
</main>

<footer>Mon Bot PC — Un vote par compte et par sondage.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
    getFirestore,
    collection,
    doc,
    getDocs,
    getDoc,
    setDoc,
    deleteDoc,
    updateDoc,
    query,
    orderBy,
    limit,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGFf2YNntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    messagingSenderId: "691729637594",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let utilisateur = null;
let admin = false;
let chargementEnCours = false;
let rechargementDemande = false;

function element(tag, texte = "") {
    const e = document.createElement(tag);
    e.textContent = texte;
    return e;
}

function erreurMessage(error) {
    console.error(error);
    if (error?.code === "permission-denied") {
        return "Accès refusé par Firestore. Vérifie les règles de sécurité.";
    }
    return error?.message || "Une erreur est survenue.";
}

async function verifierAdmin(user) {
    if (!user) return false;

    const ADMINS = [
        "rWEk3vGHK1W2EDvemVfw6xNtKxU2",
        "8lq3zxa8nkdZ6hXpa8FeZTpI55Q2"
    ];

    return ADMINS.includes(user.uid);
}

onAuthStateChanged(auth, async user => {
    utilisateur = user;
    admin = await verifierAdmin(user);

    document.getElementById("auth-status").textContent = user
        ? (admin ? "Connecté — Administrateur" : "Connecté")
        : "Non connecté — Connecte-toi pour voter.";

    document.getElementById("admin-panel").hidden = !admin;

    await chargerActualites();
    await chargerSondages();
});

async function chargerActualites() {
    const container = document.getElementById("news-container");
    container.textContent = "Chargement des actualités...";

    try {
        const snap = await getDocs(query(
            collection(db, "news"),
            orderBy("createdAt", "desc"),
            limit(30)
        ));

        container.replaceChildren();

        if (snap.empty) {
            container.textContent = "Aucune actualité pour le moment.";
            return;
        }

        snap.forEach(documentSnap => {
            const news = documentSnap.data();
            const card = element("article");
            card.className = "card";

            card.appendChild(element("h3", news.title || news.titre || "Actualité"));

            const texte = element(
                "p",
                news.content || news.contenu || news.description || ""
            );
            texte.style.whiteSpace = "pre-wrap";
            card.appendChild(texte);

            container.appendChild(card);
        });
    } catch (error) {
        container.textContent = erreurMessage(error);
    }
}

document.getElementById("create-poll-form").addEventListener("submit", async event => {
    event.preventDefault();

    const status = document.getElementById("create-poll-status");

    if (!utilisateur || !admin) {
        status.textContent = "Accès administrateur requis.";
        return;
    }

    const question = document.getElementById("new-poll-question").value.trim();
    const options = document.getElementById("new-poll-options").value
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    if (!question || options.length < 2 || options.length > 6) {
        status.textContent = "Entre une question et de 2 à 6 réponses.";
        return;
    }

    try {
        const ref = doc(collection(db, "polls"));

        await setDoc(ref, {
            question,
            options,
            authorUid: utilisateur.uid,
            createdAt: serverTimestamp()
        });

        event.target.reset();
        status.textContent = "✅ Sondage créé !";
        await chargerSondages();
    } catch (error) {
        status.textContent = erreurMessage(error);
    }
});

async function chargerSondages() {
    if (chargementEnCours) {
        rechargementDemande = true;
        return;
    }

    chargementEnCours = true;
    rechargementDemande = false;

    const container = document.getElementById("polls-container");
    container.textContent = "Chargement des sondages...";

    try {
        const pollsSnap = await getDocs(query(
            collection(db, "polls"),
            limit(100)
        ));

        container.replaceChildren();

        if (pollsSnap.empty) {
            container.textContent = "Aucun sondage pour le moment.";
            return;
        }

        for (const pollDoc of pollsSnap.docs) {
            const poll = pollDoc.data();
            const pollId = pollDoc.id;
            const options = Array.isArray(poll.options) ? poll.options : [];

            if (options.length < 2) continue;

            const card = element("article");
            card.className = "card";
            card.appendChild(element("h3", poll.question || "Sondage"));

            const form = element("form");
            const choix = element("div");

            options.forEach((option, index) => {
                const label = element("label");
                label.className = "poll-option";

                const radio = element("input");
                radio.type = "radio";
                radio.name = "vote-" + pollId;
                radio.value = String(index);
                radio.disabled = false;

                label.appendChild(radio);
                label.appendChild(element("span", String(option)));
                choix.appendChild(label);
            });

            form.appendChild(choix);

            const voter = element("button", "🗳️ Voter");
            voter.type = "submit";
           voter.disabled = false;
            form.appendChild(voter);

            const voirResultats = element("button", "📊 Voir les résultats");
            voirResultats.type = "button";
            voirResultats.className = "secondary";
            form.appendChild(voirResultats);

            const resultats = element("div");
            resultats.hidden = true;

            const message = element("p");
            message.className = "poll-status";

            const supprimerVote = element("button", "🗑️ Supprimer mon vote");
            supprimerVote.type = "button";
            supprimerVote.className = "secondary";
            supprimerVote.hidden = true;

            const modifierQuestion = element("button", "✏️ Modifier");
            modifierQuestion.hidden = !admin;

            const supprimerSondage = element("button", "❌ Supprimer le sondage");
            supprimerSondage.className = "danger";
            supprimerSondage.hidden = !admin;

            card.appendChild(form);
            card.appendChild(resultats);
            card.appendChild(message);
            card.appendChild(supprimerVote);
            card.appendChild(modifierQuestion);
            card.appendChild(supprimerSondage);

            container.appendChild(card);

            let monVote = null;

            async function chargerMonVote() {
                monVote = null;

                if (!utilisateur) return;

                const ref = doc(db, "polls", pollId, "votes", utilisateur.uid);
                const snap = await getDoc(ref);

                if (snap.exists()) {
                    monVote = snap.data();

                    const radio = form.querySelector(
                        `input[value="${monVote.optionIndex}"]`
                    );

                    if (radio) radio.checked = true;

                    voter.textContent = "✏️ Modifier mon vote";
                    supprimerVote.hidden = false;
                } else {
                    voter.textContent = "🗳️ Voter";
                    supprimerVote.hidden = true;
                }
            }

            async function afficherResultats() {
                resultats.hidden = false;
                resultats.textContent = "Chargement des résultats...";

                try {
                    const votesSnap = await getDocs(
                        collection(db, "polls", pollId, "votes")
                    );

                    const counts = Array(options.length).fill(0);

                    votesSnap.forEach(voteDoc => {
                        const index = voteDoc.data().optionIndex;
                        if (Number.isInteger(index) && index >= 0 && index < counts.length) {
                            counts[index]++;
                        }
                    });

                    const total = counts.reduce((a, b) => a + b, 0);
                    resultats.replaceChildren();

                    resultats.appendChild(
                        element("p", `👥 ${total} vote${total === 1 ? "" : "s"} au total`)
                    );

                    options.forEach((option, index) => {
                        const count = counts[index];
                        const percentage = total ? Math.round(count / total * 100) : 0;

                        const row = element("div");
                        row.className = "poll-result";

                        const title = element(
                            "div",
                            `${option} — ${count} vote${count === 1 ? "" : "s"} (${percentage} %)`
                        );
                        title.className = "poll-result-title";

                        const track = element("div");
                        track.className = "poll-track";

                        const bar = element("div");
                        bar.className = "poll-bar";
                        bar.style.width = percentage + "%";

                        track.appendChild(bar);
                        row.appendChild(title);
                        row.appendChild(track);
                        resultats.appendChild(row);
                    });
                } catch (error) {
                    resultats.textContent = erreurMessage(error);
                }
            }

            voirResultats.addEventListener("click", async () => {
                if (resultats.hidden) {
                    await afficherResultats();
                    voirResultats.textContent = "🙈 Masquer les résultats";
                } else {
                    resultats.hidden = true;
                    voirResultats.textContent = "📊 Voir les résultats";
                }
            });

            form.addEventListener("submit", async event => {
                event.preventDefault();

                if (!utilisateur) {
                    message.textContent = "Connecte-toi pour voter.";
                    return;
                }

                const selection = form.querySelector('input[type="radio"]:checked');

                if (!selection) {
                    message.textContent = "Choisis une réponse.";
                    return;
                }

                voter.disabled = true;

                try {
                    const voteRef = doc(db, "polls", pollId, "votes", utilisateur.uid);
                    const optionIndex = Number(selection.value);

                    if (monVote) {
                        await updateDoc(voteRef, { optionIndex });
                    } else {
                        await setDoc(voteRef, {
                            uid: utilisateur.uid,
                            optionIndex,
                            createdAt: serverTimestamp()
                        });
                    }

                    message.textContent = "✅ Vote enregistré !";
                    await chargerMonVote();
                    await afficherResultats();
                    voirResultats.textContent = "🙈 Masquer les résultats";
                } catch (error) {
                    message.textContent = erreurMessage(error);
                } finally {
                    voter.disabled = false;
                }
            });

            supprimerVote.addEventListener("click", async () => {
                if (!utilisateur || !confirm("Supprimer ton vote ?")) return;

                supprimerVote.disabled = true;

                try {
                    await deleteDoc(
                        doc(db, "polls", pollId, "votes", utilisateur.uid)
                    );

                    message.textContent = "✅ Vote supprimé.";
                    form.reset();
                    await chargerMonVote();
                    await afficherResultats();
                    voirResultats.textContent = "🙈 Masquer les résultats";
                } catch (error) {
                    message.textContent = erreurMessage(error);
                } finally {
                    supprimerVote.disabled = false;
                }
            });

            modifierQuestion.addEventListener("click", async () => {
                if (!admin) return;

                const question = prompt("Nouvelle question :", poll.question || "");
                if (question === null || !question.trim()) return;

                try {
                    await updateDoc(doc(db, "polls", pollId), {
                        question: question.trim()
                    });
                    await chargerSondages();
                } catch (error) {
                    message.textContent = erreurMessage(error);
                }
            });

            supprimerSondage.addEventListener("click", async () => {
                if (!admin || !confirm("Supprimer définitivement ce sondage ?")) return;

                try {
                    const votesSnap = await getDocs(
                        collection(db, "polls", pollId, "votes")
                    );

                    for (const voteDoc of votesSnap.docs) {
                        await deleteDoc(voteDoc.ref);
                    }

                    await deleteDoc(doc(db, "polls", pollId));
                    await chargerSondages();
                } catch (error) {
                    message.textContent = erreurMessage(error);
                }
            });

            try {
                await chargerMonVote();
            } catch (error) {
                message.textContent = erreurMessage(error);
            }
        }
    } catch (error) {
        container.textContent = erreurMessage(error);
    } finally {
        chargementEnCours = false;

        if (rechargementDemande) {
            rechargementDemande = false;
            queueMicrotask(() => chargerSondages());
        }
    }
}

document.getElementById("refresh-button").addEventListener("click", async () => {
    await chargerActualites();
    await chargerSondages();
});
</script>

</body>
</html>
