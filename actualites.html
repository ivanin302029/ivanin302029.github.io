<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Actualités — Mon Bot PC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0B1120;
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 25px;
}

main {
    max-width: 950px;
    margin: auto;
}

a {
    color: #60A5FA;
    text-decoration: none;
}

h1, h2 {
    color: #60A5FA;
}

.card {
    background: #172033;
    border: 1px solid #334155;
    padding: 25px;
    margin: 20px 0;
    border-radius: 15px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    background: #334155;
}

.small {
    color: #94A3B8;
    font-size: 13px;
}

.content {
    white-space: pre-wrap;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

button {
    background: #3B82F6;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    cursor: pointer;
}

button:hover:not(:disabled) {
    background: #2563EB;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* SONDAGES */

.poll-card {
    background: #2B2D36;
    border: 1px solid #3B3D48;
    padding: 20px;
    border-radius: 12px;
    margin: 20px 0;
}

.poll-title {
    color: #F3F4F6;
    font-size: 17px;
    font-weight: bold;
    margin: 10px 0 5px;
}

.poll-subtitle {
    color: #A1A1AA;
    font-size: 13px;
    margin-bottom: 15px;
}

.poll-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #383A44;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 15px;
    margin: 9px 0;
    cursor: pointer;
    transition: .2s;
}

.poll-option:hover {
    background: #454753;
}

.poll-option.selected {
    border-color: #818CF8;
    background: #42445C;
}

.poll-option input {
    accent-color: #818CF8;
    width: 19px;
    height: 19px;
    cursor: pointer;
}

.poll-option-text {
    font-size: 14px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.poll-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.poll-votes {
    font-size: 13px;
    color: #E5E7EB;
    font-weight: bold;
}

.poll-result-button {
    background: transparent;
    font-weight: bold;
}

.poll-result-button:hover {
    background: #454753;
}

.poll-vote-button {
    background: #5865F2;
}

.poll-vote-button:hover:not(:disabled) {
    background: #4752C4;
}

/* RÉSULTATS */

.result-option {
    margin: 12px 0;
    background: #383A44;
    border-radius: 10px;
    padding: 12px;
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.result-name {
    font-weight: bold;
    overflow-wrap: anywhere;
}

.result-percent {
    font-weight: bold;
    color: #C7D2FE;
}

.result-track {
    height: 12px;
    background: #242630;
    border-radius: 20px;
    overflow: hidden;
}

.result-fill {
    height: 100%;
    background: #818CF8;
    border-radius: 20px;
    transition: width .4s ease;
}

.result-count {
    font-size: 12px;
    color: #A1A1AA;
    margin-top: 7px;
}

.poll-message {
    color: #A1A1AA;
    font-size: 13px;
    margin-top: 12px;
}

@media(max-width: 600px) {
    body { padding: 12px; }
    .card, .poll-card { padding: 15px; }
}
</style>

</head>

<body>

<main>

<a href="index.html">← Retour à l'accueil</a>

<h1>📰 Actualités Mon Bot PC</h1>

<button id="refresh">↻ Actualiser</button>

<h2>Dernières actualités</h2>

<div id="news">Chargement...</div>

<h2>📊 Sondages</h2>

<div id="polls">Chargement...</div>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const config = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGF2FYnntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    storageBucket: "monbotpc.firebasestorage.app",
    messagingSenderId: "691729637594",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const app = initializeApp(config);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

const ADMINS = [
    "rWEk3vGHK1W2EDvemVfw6xNtKxU2",
    "8lq3zxa8nkdZ6hXpa8FeZTpI55Q2"
];

function element(tag, text = "") {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
}

/* ==========================================
   PROFILS ADMINISTRATEURS
========================================== */

async function chargerProfils() {
    const profils = {};

    for (const uid of ADMINS) {
        try {
            const snapshot = await getDoc(
                doc(db, "admin_profiles", uid)
            );

            if (snapshot.exists()) {
                profils[uid] = snapshot.data();
            }

        } catch (error) {
            console.warn(error);
        }
    }

    return profils;
}

function afficherProfil(uid, profils) {
    const profil = profils[uid] || {};

    const cadre = element("div");
    cadre.className = "profile";

    if (profil.avatarUrl?.startsWith("https://")) {
        const image = document.createElement("img");

        image.src = profil.avatarUrl;
        image.className = "avatar";
        image.alt = "Photo de profil";

        image.onerror = () => {
            image.replaceWith(element("span", "👤"));
        };

        cadre.appendChild(image);

    } else {
        cadre.appendChild(element("span", "👤"));
    }

    cadre.appendChild(
        element(
            "strong",
            profil.nickname || "Équipe Mon Bot PC"
        )
    );

    return cadre;
}

/* ==========================================
   ACTUALITÉS
========================================== */

async function chargerActualites(profils) {
    const container = document.getElementById("news");

    const snapshot = await getDocs(
        collection(db, "news")
    );

    const actualites = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
    }));

    actualites.sort((a, b) =>
        (b.createdAt?.seconds || 0) -
        (a.createdAt?.seconds || 0)
    );

    container.replaceChildren();

    if (!actualites.length) {
        container.textContent = "Aucune actualité.";
    }

    for (const actualite of actualites) {
        const carte = element("article");
        carte.className = "card";

        carte.appendChild(
            afficherProfil(actualite.authorUid, profils)
        );

        carte.appendChild(
            element("h2", actualite.title || "Sans titre")
        );

        const categorie = element(
            "p",
            actualite.category || "Annonce"
        );

        categorie.className = "small";
        carte.appendChild(categorie);

        const contenu = element(
            "p",
            actualite.content || ""
        );

        contenu.className = "content";

        carte.appendChild(contenu);
        container.appendChild(carte);
    }

    localStorage.setItem(
        "monbotpc_news_lues",
        JSON.stringify(actualites.map(a => a.id))
    );
}

/* ==========================================
   SONDAGES DISCORD
========================================== */

async function chargerSondages(profils) {
    const container = document.getElementById("polls");
    container.replaceChildren();

    try {
        const snapshot = await getDocs(collection(db, "polls"));

        const sondages = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
        }));

        sondages.sort((a, b) =>
            (b.createdAt?.seconds || 0) -
            (a.createdAt?.seconds || 0)
        );

        if (!sondages.length) {
            container.textContent = "Aucun sondage.";
            return;
        }

        for (const sondage of sondages) {
            const carte = element("article");
            carte.className = "card";

            carte.appendChild(
                afficherProfil(sondage.authorUid, profils)
            );

            carte.appendChild(
                element("h2", "📊 " + (sondage.question || "Sondage"))
            );

            const options = Array.isArray(sondage.options)
                ? sondage.options
                : [];

            if (options.length < 2) {
                carte.appendChild(element("p", "Ce sondage est invalide."));
                container.appendChild(carte);
                continue;
            }

            const formulaire = element("form");
            let voteExistant = null;

            if (currentUser) {
                try {
                    const voteSnapshot = await getDoc(
                        doc(
                            db,
                            "polls",
                            sondage.id,
                            "votes",
                            currentUser.uid
                        )
                    );

                    if (voteSnapshot.exists()) {
                        voteExistant = voteSnapshot.data();
                    }
                } catch (error) {
                    console.error("Lecture du vote impossible :", error);
                    formulaire.appendChild(
                        element("p", "Impossible de charger votre vote.")
                    );
                }
            }

            const choix = document.createElement("div");

            options.forEach((option, index) => {
                const label = element("label");
                label.className = "option";

                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "sondage_" + sondage.id;
                radio.value = String(index);

                if (
                    voteExistant &&
                    voteExistant.optionIndex === index
                ) {
                    radio.checked = true;
                }

                label.append(
                    radio,
                    document.createTextNode(" " + option)
                );

                choix.appendChild(label);
            });

            formulaire.appendChild(choix);

            if (!currentUser) {
                formulaire.appendChild(
                    element("p", "Connectez-vous pour voter.")
                );

            } else {
                const boutonVoter = element(
                    "button",
                    voteExistant ? "Enregistrer mon nouveau vote" : "Voter"
                );

                boutonVoter.type = "submit";
                formulaire.appendChild(boutonVoter);

                if (voteExistant) {
                    const boutonSupprimer = element(
                        "button",
                        "Supprimer mon vote"
                    );

                    boutonSupprimer.type = "button";
                    boutonSupprimer.style.background = "#DC2626";
                    boutonSupprimer.style.marginLeft = "8px";

                    formulaire.appendChild(boutonSupprimer);

                    boutonSupprimer.addEventListener("click", async () => {
                        if (!confirm("Veux-tu vraiment supprimer ton vote ?")) {
                            return;
                        }

                        boutonSupprimer.disabled = true;

                        try {
                            await deleteDoc(
                                doc(
                                    db,
                                    "polls",
                                    sondage.id,
                                    "votes",
                                    currentUser.uid
                                )
                            );

                            await charger();

                        } catch (error) {
                            console.error(error);
                            alert(
                                "Impossible de supprimer le vote : " +
                                error.message
                            );
                            boutonSupprimer.disabled = false;
                        }
                    });
                }

                formulaire.addEventListener("submit", async event => {
                    event.preventDefault();

                    const selection = formulaire.querySelector(
                        'input[type="radio"]:checked'
                    );

                    if (!selection) {
                        alert("Choisis une réponse.");
                        return;
                    }

                    boutonVoter.disabled = true;

                    try {
                        const voteRef = doc(
                            db,
                            "polls",
                            sondage.id,
                            "votes",
                            currentUser.uid
                        );

                        const donneesVote = {
                            uid: currentUser.uid,
                            optionIndex: Number(selection.value)
                        };

                        if (voteExistant) {
                            await updateDoc(voteRef, donneesVote);
                        } else {
                            await setDoc(voteRef, {
                                ...donneesVote,
                                createdAt: serverTimestamp()
                            });
                        }

                        await charger();

                    } catch (error) {
                        console.error(error);
                        alert(
                            "Impossible d'enregistrer le vote : " +
                            error.message
                        );
                        boutonVoter.disabled = false;
                    }
                });
            }

            container.appendChild(carte);
        }

    } catch (error) {
        console.error(error);
        container.textContent =
            "Erreur lors du chargement des sondages : " + error.message;
    }
}

/* ==========================================
   CHARGEMENT
========================================== */

async function charger() {
    const newsContainer = document.getElementById("news");
    const pollsContainer = document.getElementById("polls");

    try {
        const profils = await chargerProfils();

        try {
            await chargerActualites(profils);
        } catch (error) {
            console.error(error);
            newsContainer.textContent =
                "Erreur actualités : " + error.message;
        }

        try {
            await chargerSondages(profils);
        } catch (error) {
            console.error(error);
            pollsContainer.textContent =
                "Erreur sondages : " + error.message;
        }

    } catch (error) {
        console.error(error);

        pollsContainer.textContent =
            "Erreur : " + error.message;
    }
}

document.getElementById("refresh")
    .addEventListener("click", charger);

onAuthStateChanged(auth, user => {
    currentUser = user;
    charger();
});

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
