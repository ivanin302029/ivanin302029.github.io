<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualités — Mon Bot PC</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0B1120;
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 30px 20px;
        }

        main {
            max-width: 900px;
            margin: auto;
        }

        h1 { color: #60A5FA; }

        a {
            color: #60A5FA;
            text-decoration: none;
        }

        .card {
            background: #172033;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
        }

        .card h2 {
            color: #60A5FA;
            margin-top: 0;
        }

        .date {
            color: #94A3B8;
            font-size: 13px;
        }

        .content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.7;
        }

        button {
            background: #3B82F6;
            border: 0;
            border-radius: 9px;
            padding: 12px 20px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<main>
    <a href="index.html">← Retour à l'accueil</a>

    <h1>📰 Actualités Mon Bot PC</h1>

    <p>Découvrez les dernières annonces officielles.</p>

    <button id="refresh">↻ Actualiser</button>

    <div id="news">Chargement...</div>
</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const config = {
    apiKey: "AIzaSyAkH3gJ0OyXagfgTbZGF2FYnntQ7upfdWE",
    authDomain: "monbotpc.firebaseapp.com",
    projectId: "monbotpc",
    appId: "1:691729637594:web:9564d52349c04809fe85e3"
};

const app = initializeApp(config);
const db = getFirestore(app);

const container = document.getElementById("news");

async function loadNews() {

    container.textContent = "Chargement des actualités...";

    try {

        const snapshot = await getDocs(
            collection(db, "news")
        );

        const articles = [];

        snapshot.forEach(document => {
            articles.push({
                id: document.id,
                ...document.data()
            });
        });

        articles.sort((a, b) => {
            const dateA = a.createdAt?.seconds || 0;
            const dateB = b.createdAt?.seconds || 0;
            return dateB - dateA;
        });

        container.replaceChildren();

        if (articles.length === 0) {
            container.textContent =
                "Aucune actualité publiée.";
            return;
        }

        articles.forEach(article => {

            const card = document.createElement("article");
            card.className = "card";

            const title = document.createElement("h2");
            title.textContent =
                article.title || "Actualité Mon Bot PC";

            const category = document.createElement("p");
            category.textContent =
                article.category || "Annonce officielle";

            const date = document.createElement("p");
            date.className = "date";

            if (article.createdAt?.toDate) {
                date.textContent =
                    article.createdAt.toDate().toLocaleString("fr-CA");
            }

            const content = document.createElement("p");
            content.className = "content";
            content.textContent = article.content || "";

            card.append(title, category, date, content);

            container.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        container.textContent =
            "Erreur de chargement : " + error.message;
    }
}

document.getElementById("refresh")
    .addEventListener("click", loadNews);

loadNews();

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
